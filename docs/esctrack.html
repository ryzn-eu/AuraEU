<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Santa Global Ops - Live Tracker</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        /* --- RESET & BASE --- */
        * { box-sizing: border-box; }
        body, html { 
            margin: 0; padding: 0; height: 100%; width: 100%; 
            overflow: hidden; 
            font-family: 'Segoe UI', 'Roboto', Helvetica, Arial, sans-serif; 
            background: #000; color: white; 
            display: flex; flex-direction: column;
        }

        /* --- MAPPA --- */
        #map-container { 
            flex-grow: 1; position: relative; z-index: 1; 
            border-bottom: 2px solid #fbbf24;
            box-shadow: 0 0 20px rgba(251, 191, 36, 0.2);
        }
        #map { width: 100%; height: 100%; background: #050505; }
        .leaflet-tile-pane { filter: contrast(1.2) brightness(0.8) saturate(0.8); }
        .leaflet-container { background: #050505; }

        #watermark { 
            position: absolute; bottom: 15px; left: 25px; z-index: 950; 
            font-family: 'Courier New', monospace; font-weight: 300; font-size: 12px; 
            letter-spacing: 4px; color: rgba(255, 255, 255, 0.3); 
            pointer-events: none; user-select: none;
        }

        /* --- DASHBOARD --- */
        .dashboard {
            width: 100%; height: auto; min-height: 130px;
            background: linear-gradient(180deg, #0f172a 0%, #020617 100%);
            display: flex; align-items: center; justify-content: space-between;
            padding: 15px 30px; 
            box-shadow: 0 -10px 40px rgba(0,0,0,0.9);
            z-index: 1000; gap: 20px;
            border-top: 1px solid rgba(255,255,255,0.1);
        }

        .dash-left { 
            flex: 1; display: flex; flex-direction: column; justify-content: center; 
            border-left: 4px solid #fbbf24; padding-left: 20px; 
            min-width: 240px;
        }
        h2 { 
            margin: 0; font-size: 28px; font-weight: 700; color: #fbbf24; 
            text-shadow: 0 0 15px rgba(251, 191, 36, 0.4); 
            letter-spacing: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        h3 { 
            margin: 4px 0 0 0; font-size: 13px; color: #94a3b8; 
            font-weight: 600; text-transform: uppercase; letter-spacing: 2px; 
        }

        .dash-center { flex: 0 0 auto; display: flex; justify-content: center; }
        
        #status-badge { 
            display: inline-block; padding: 8px 16px; border-radius: 4px; 
            font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: 2px; 
            background: #1e293b; color: #94a3b8; white-space: nowrap;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }
        #status-badge.live { background: #dc2626; color: white; animation: pulse 2s infinite; box-shadow: 0 0 20px rgba(220, 38, 38, 0.5); }
        #status-badge.transit { background: #3b82f6; color: white; box-shadow: 0 0 20px rgba(59, 130, 246, 0.4); }
        #status-badge.rest { background: #475569; color: #cbd5e1; }

        .dash-monitors { flex: 1; display: flex; flex-direction: row; gap: 15px; align-items: center; justify-content: flex-end; }
        
        .stat-box { 
            flex: 1; max-width: 150px; min-width: 100px; 
            background: rgba(255,255,255,0.03); 
            padding: 10px 5px; border-radius: 8px; text-align: center; 
            border: 1px solid rgba(255,255,255,0.08); 
            backdrop-filter: blur(5px);
            transition: transform 0.2s;
        }
        .stat-label { display: block; font-size: 9px; color: #64748b; text-transform: uppercase; margin-bottom: 4px; font-weight: 700; letter-spacing: 1px; }
        .stat-val { font-size: 18px; font-weight: 700; color: #f1f5f9; font-family: 'Courier New', monospace; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
        .stat-val.gold { color: #fbbf24; }

        .ctrl-group { position: absolute; top: 20px; right: 20px; z-index: 2000; display: flex; gap: 10px; }
        .btn-ctrl { 
            background: #ef4444; color: white; border: 1px solid rgba(255,255,255,0.2); 
            padding: 10px 20px; border-radius: 4px; 
            font-weight: bold; font-family: 'Segoe UI', sans-serif; cursor: pointer; 
            box-shadow: 0 5px 15px rgba(0,0,0,0.5); transition: all 0.2s; 
            font-size: 11px; text-transform: uppercase; letter-spacing: 1px;
            backdrop-filter: blur(4px);
        }
        .btn-ctrl:hover { transform: translateY(-2px); background: #dc2626; }
        #speed-btn { background: rgba(59, 130, 246, 0.9); border-color: #60a5fa; }
        #speed-btn.active { background: #eab308; color: black; border-color: #fef08a; }

        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.7; } 100% { opacity: 1; } }
        
        #snow-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 900; }
        .snowflake { position: absolute; top: -10px; background: white; border-radius: 50%; opacity: 0.8; animation: fall linear infinite; }

        .santa-icon { font-size: 45px; filter: drop-shadow(0 0 15px rgba(251, 191, 36, 0.8)); transition: transform 0.5s; }
        .gift-marker { font-size: 16px; filter: drop-shadow(0 0 5px rgba(255,255,255,0.5)); }

        @media (max-width: 900px) {
            .dashboard { flex-direction: column; padding: 15px; height: auto; gap: 15px; }
            .dash-left { border: none; padding: 0; width: 100%; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px; }
            .dash-monitors { width: 100%; justify-content: space-between; }
        }
    </style>
</head>

        // ==========================================
        // 2. GENERAZIONE ROTTA TEMPORALE
        // ==========================================
        let schedule = [];
        let zones = {};
        citiesDB.forEach(city => {
            let offset = city[4];
            if (!zones[offset]) zones[offset] = [];
            zones[offset].push(city);
        });

        const GLOBAL_START_UTC = 9.30; 
        
        let sortedOffsets = Object.keys(zones).map(Number).sort((a,b) => b - a);
        let previousTime = GLOBAL_START_UTC; 

        // Rovaniemi Start
        schedule.push({ name: "Rovaniemi", sub: "Base Operativa", lat: 66.54, lng: 25.74, utc: 9.30 });

        sortedOffsets.forEach(offset => {
            let midnightInUTC = 24.0 - offset;
            let citiesInZone = zones[offset];
            citiesInZone.sort((a, b) => b[2] - a[2]);

            let timeWindow = 0.95; 
            let timePerCity = timeWindow / citiesInZone.length;

            citiesInZone.forEach((city, idx) => {
                let scheduledTime = midnightInUTC + (idx * timePerCity);
                if (scheduledTime <= previousTime) scheduledTime = previousTime + 0.03; 

                schedule.push({
                    name: city[0],
                    sub: city[1],
                    lat: city[2],
                    lng: city[3],
                    utc: scheduledTime
                });
                previousTime = scheduledTime;
            });
        });

        // Rientro
        schedule.push({ name: "Rovaniemi", sub: "Missione Compiuta", lat: 66.54, lng: 25.74, utc: previousTime + 2 });

        // ==========================================
        // 3. MAPPA E GRAFICA
        // ==========================================
        const map = L.map('map', { zoomControl: false, attributionControl: false, dragging: true, minZoom: 2, worldCopyJump: true }).setView([66.54, 25.74], 3);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { maxZoom: 19 }).addTo(map);
        
        map.createPane('giftPane'); map.getPane('giftPane').style.zIndex = 400; 
        map.createPane('santaPane'); map.getPane('santaPane').style.zIndex = 650;

        const santaIcon = L.divIcon({ className: 'custom-santa', html: '<div class="santa-icon">🎅</div>', iconSize: [50, 50], iconAnchor: [25, 25] });
        const marker = L.marker([66.54, 25.74], { icon: santaIcon, pane: 'santaPane' }).addTo(map);
        const giftIcon = L.divIcon({ className: 'custom-gift', html: '<div class="gift-marker">🎁</div>', iconSize: [20, 20], iconAnchor: [10, 10] });

        function getBezierPoint(p0, p1, p2, t) {
            const x = (1-t)*(1-t)*p0.lat + 2*(1-t)*t*p1.lat + t*t*p2.lat;
            const y = (1-t)*(1-t)*p0.lng + 2*(1-t)*t*p1.lng + t*t*p2.lng;
            return { lat: x, lng: y };
        }

        function getControlPoint(p0, p1) {
            const dist = Math.sqrt(Math.pow(p1.lat-p0.lat,2) + Math.pow(p1.lng-p0.lng,2));
            const offset = dist * 0.2; 
            return { lat: (p0.lat + p1.lat)/2 + offset, lng: (p0.lng + p1.lng)/2 };
        }

        // ==========================================
        // 4. LOGICA MOTORE
        // ==========================================
        let isTestMode = false;
        let speedMult = 1;
        let accumulatedTime = 0;
        let lastFrame = 0;
        let lastLegIndex = -1;

        const START_TS = new Date(Date.UTC(new Date().getFullYear(), 11, 24, 9, 0, 0)).getTime(); 

        function getSantaPos(currentUtcDec) {
            let leg = -1;
            for(let i=0; i<schedule.length-1; i++) {
                if (currentUtcDec >= schedule[i].utc && currentUtcDec < schedule[i+1].utc) {
                    leg = i; break;
                }
            }
            if (leg === -1) {
                if (currentUtcDec >= schedule[schedule.length-1].utc) return { finished: true, ...schedule[schedule.length-1] };
                return null; 
            }

            const start = schedule[leg];
            const end = schedule[leg+1];
            const duration = end.utc - start.utc;
            const t = (currentUtcDec - start.utc) / duration;
            
            // Movimento Curvo
            let sLng = start.lng;
            let eLng = end.lng;
            if (eLng - sLng > 180) sLng += 360;
            if (sLng - eLng > 180) eLng += 360;

            const p0 = {lat: start.lat, lng: sLng};
            const p2 = {lat: end.lat, lng: eLng};
            const p1 = getControlPoint(p0, p2);

            let pos = getBezierPoint(p0, p1, p2, t);
            
            while(pos.lng > 180) pos.lng -= 360;
            while(pos.lng < -180) pos.lng += 360;

            return { lat: pos.lat, lng: pos.lng, legIdx: leg, current: start, next: end, progress: t };
        }

        function startTestMode() {
            isTestMode = true;
            accumulatedTime = 0;
            lastFrame = performance.now();
            document.getElementById('speed-btn').style.display = 'block';
            toggleSpeed(); 
        }

        function toggleSpeed() {
            const btn = document.getElementById('speed-btn');
            if (speedMult === 1) {
                speedMult = 1000; 
                btn.innerText = "⏩ NORMALE";
                btn.classList.add('active');
            } else {
                speedMult = 1;
                btn.innerText = "⚡ VELOCITÀ x1000";
                btn.classList.remove('active');
            }
        }

        function loop(now) {
            let currentTs;

            if (isTestMode) {
                let dt = now - lastFrame;
                lastFrame = now;
                accumulatedTime += dt * speedMult;
                currentTs = START_TS + accumulatedTime;
            } else {
                currentTs = Date.now();
            }

            let simDate = new Date(currentTs);
            let diffMs = currentTs - new Date(Date.UTC(simDate.getUTCFullYear(), 11, 24, 0, 0, 0)).getTime();
            let utcDecimal = diffMs / (1000 * 60 * 60);

            document.getElementById('val-utc').innerText = simDate.getUTCHours().toString().padStart(2,'0') + ":" + simDate.getUTCMinutes().toString().padStart(2,'0');
            document.getElementById('val-local').innerText = simDate.getHours().toString().padStart(2,'0') + ":" + simDate.getMinutes().toString().padStart(2,'0');

            const data = getSantaPos(utcDecimal);

            if (!data) {
                // STANDBY
                document.getElementById('status-badge').innerText = "● STANDBY";
                document.getElementById('status-badge').className = "rest";
                document.getElementById('loc-name').innerText = "ROVANIEMI";
                document.getElementById('loc-sub').innerText = "PREPARATIVI";
                document.getElementById('val-activity').innerText = "CARICO";
                
                let diff = START_TS - Date.now();
                if (isTestMode) diff = 0;
                
                if (diff > 0) {
                    let h = Math.floor(diff/3600000);
                    let m = Math.floor((diff%3600000)/60000);
                    let s = Math.floor((diff%60000)/1000);
                    document.getElementById('val-activity').innerText = `-${h}h ${m}m ${s}s`;
                }

                marker.setLatLng([66.54, 25.74]);
            } else if (data.finished) {
                document.getElementById('status-badge').innerText = "● HOME";
                document.getElementById('loc-name').innerText = "MISSIONE COMPIUTA";
                document.getElementById('val-activity').innerText = "RIPOSO";
                marker.setLatLng([66.54, 25.74]);
            } else {
                marker.setLatLng([data.lat, data.lng]);
                map.panTo([data.lat, data.lng], { animate: false });

                if (data.legIdx > lastLegIndex) {
                    if (data.legIdx > 0) {
                        let prev = schedule[data.legIdx];
                        L.marker([prev.lat, prev.lng], { icon: giftIcon, pane: 'giftPane' }).addTo(map);
                    }
                    lastLegIndex = data.legIdx;
                }

                if (data.progress < 0.25) {
                    document.getElementById('status-badge').innerText = "● DELIVERY";
                    document.getElementById('status-badge').className = "live";
                    document.getElementById('loc-name').innerText = data.current.name.toUpperCase();
                    document.getElementById('loc-sub').innerText = data.current.sub.toUpperCase();
                    document.getElementById('val-activity').innerText = "CONSEGNA";
                } else {
                    document.getElementById('status-badge').innerText = "● TRANSIT";
                    document.getElementById('status-badge').className = "transit";
                    document.getElementById('loc-name').innerText = "IN VOLO";
                    document.getElementById('loc-sub').innerText = ">> " + data.next.name.toUpperCase();
                    document.getElementById('val-activity').innerText = speedMult > 1 ? "IPERVELOCITÀ" : "VOLO";
                }
            }

            requestAnimationFrame(loop);
        }

        requestAnimationFrame(loop);

        function snow() {
            const b = document.getElementById('snow-layer');
            const s = document.createElement('div');
            s.className = 'snowflake';
            s.style.left = Math.random()*100+'%';
            s.style.width = (Math.random()*3+2)+'px'; s.style.height = s.style.width;
            s.style.opacity = Math.random()*0.5 + 0.5;
            s.style.animationDuration = (Math.random()*2+3)+'s';
            b.appendChild(s);
            setTimeout(()=>s.remove(), 5000);
        }
        setInterval(snow, 100);
    </script>
</body>
</html>
