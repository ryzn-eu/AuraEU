<!DOCTYPE html>
<html lang="en" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="google" content="notranslate">
    <title>Aura Music</title>
    
    <link rel="icon" href="https://via.placeholder.com/192x192">
    <link rel="apple-touch-icon" href="https://via.placeholder.com/192x192">
    <meta name="theme-color" content="#0a0a0c">
    <link rel="manifest" href="./manifest.json">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/color-thief/2.3.2/color-thief.umd.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <style>
        /* --- DESIGN SYSTEM --- */
        :root { 
            --primary: #8b5cf6;    
            --secondary: #06b6d4;  
            --bg-deep: #050505;    
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --glass-blur: 24px;
        }

        body { 
            background-color: var(--bg-deep); 
            color: #ffffff; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow-x: hidden; 
            -webkit-tap-highlight-color: transparent;
            padding-bottom: 120px;
        }

        .fixed-background { 
            position: fixed; inset: 0; z-index: -2; 
            background: radial-gradient(circle at center, #1a1a2e 0%, #000000 100%);
            pointer-events: none; 
        }

        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(var(--glass-blur));
            -webkit-backdrop-filter: blur(var(--glass-blur));
            border: 1px solid var(--glass-border);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        /* --- WIDGETS & CARDS --- */
        .yt-grid-mobile-fix {
            display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 2rem;
        }
        @media (min-width: 600px) { .yt-grid-mobile-fix { grid-template-columns: repeat(3, 1fr); } }

        .yt-card {
            background: rgba(255,255,255,0.07); border-radius: 8px;
            display: flex; align-items: center; padding: 0; gap: 10px; height: 56px;
            transition: background 0.2s; cursor: pointer; overflow: hidden;
            border: 1px solid rgba(255,255,255,0.02);
        }
        .yt-card:active { background: rgba(255,255,255,0.15); }
        .yt-img { height: 56px; width: 56px; object-fit: cover; flex-shrink: 0; }
        .yt-info { flex: 1; overflow: hidden; padding-right: 8px; display: flex; flex-direction: column; justify-content: center; }
        .yt-title { font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .yt-artist { font-size: 11px; color: #aaa; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* IOS WIDGETS */
        .ios-widget-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 24px 0; }
        .ios-card {
            background: linear-gradient(135deg, rgba(255,255,255,0.1), rgba(255,255,255,0.05));
            border-radius: 18px; padding: 16px;
            display: flex; flex-direction: column; justify-content: space-between;
            min-height: 120px; position: relative; overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .ios-content { position: relative; z-index: 10; height: 100%; display: flex; flex-direction: column; justify-content: space-between; }
        .live-dot { width: 8px; height: 8px; background: #22c55e; border-radius: 50%; box-shadow: 0 0 8px #22c55e; display: inline-block; margin-right: 6px; }
        .widget-block-title { font-size: 18px; font-weight: 800; margin-bottom: 12px; padding-left: 4px; }

        /* STORIES */
        .stories-scroll-container { display: flex; overflow-x: auto; gap: 16px; padding: 10px 4px; scrollbar-width: none; margin-bottom: 1.5rem; }
        .stories-scroll-container::-webkit-scrollbar { display: none; }
        .story-item { display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; flex-shrink: 0; }
        .story-bubble {
            width: 70px; height: 70px; border-radius: 50%; padding: 2px;
            background: linear-gradient(45deg, #8b5cf6, #06b6d4);
            display: flex; justify-content: center; align-items: center; transition: transform 0.2s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .story-bubble:active { transform: scale(0.95); }
        .story-inner {
            width: 100%; height: 100%; background: #111; border-radius: 50%;
            display: flex; justify-content: center; align-items: center; font-size: 26px; border: 3px solid var(--bg-deep);
        }
        .story-username { font-size: 10px; color: #ccc; max-width: 70px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        /* PLAYER IMMERSIVO */
        #immersive-mode { background: radial-gradient(circle at center, #1e1b4b 0%, #000000 100%); }
        .immersive-art-container { width: 280px; height: 280px; position: relative; margin: 2rem auto; border-radius: 24px; box-shadow: 0 20px 60px rgba(0,0,0,0.6); overflow: hidden; }
        .art-square { width: 100%; height: 100%; border-radius: 24px; object-fit: cover; border: 1px solid rgba(255,255,255,0.1); }
        
        /* TESTO SCORREVOLE INTELLIGENTE */
        .smart-scroller { white-space: nowrap; display: inline-block; transition: transform 1s ease; }
        .smart-scroller.scrolling { animation: pingPongScroll 12s linear infinite alternate; }
        @keyframes pingPongScroll { 0%, 25% { transform: translateX(0); } 75%, 100% { transform: translateX(var(--scroll-distance)); } }
        #immersive-title-wrapper { mask-image: linear-gradient(90deg, transparent 0%, #000 5%, #000 95%, transparent 100%); -webkit-mask-image: linear-gradient(90deg, transparent 0%, #000 5%, #000 95%, transparent 100%); overflow: hidden; }

        /* LYRICS */
        #lyrics-container {
            position: absolute; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(10px);
            display: flex; flex-direction: column; align-items: center; overflow-y: scroll; scroll-behavior: smooth;
            padding: 20px; text-align: center; border-radius: 24px;
            mask-image: linear-gradient(to bottom, transparent 0%, black 15%, black 85%, transparent 100%);
        }
        #lyrics-container::-webkit-scrollbar { display: none; }
        .lyric-line { font-size: 16px; font-weight: 600; color: rgba(255,255,255,0.4); margin: 10px 0; cursor: pointer; transition: all 0.3s; }
        .lyric-line.active { color: #fff; transform: scale(1.1); text-shadow: 0 0 10px white; }

        .controls-pill { background: rgba(20, 20, 20, 0.6); backdrop-filter: blur(20px); border-radius: 50px; padding: 12px 24px; display: flex; justify-content: space-between; align-items: center; width: 100%; max-width: 320px; margin: 0 auto; border: 1px solid rgba(255,255,255,0.1); }
        .pill-btn { display: flex; flex-direction: column; align-items: center; font-size: 10px; color: #aaa; gap: 4px; }
        .pill-btn.active { color: var(--secondary); text-shadow: 0 0 10px var(--secondary); }

        .player-bar-new {
            position: fixed; bottom: 20px; left: 16px; right: 16px;
            background: rgba(15, 15, 20, 0.9); backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; height: 72px;
            z-index: 100; display: flex; align-items: center; padding: 0 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
            transform: translateY(150%); transition: transform 0.4s;
        }
        .player-bar-new.active { transform: translateY(0); }
        
        /* Utils */
        .horizontal-scroll { display: flex; overflow-x: auto; gap: 1rem; scrollbar-width: none; padding-bottom: 10px; }
        .horizontal-scroll::-webkit-scrollbar { display: none; }
        .section-page { display: none; animation: fadeIn 0.4s; }
        .section-page.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        #visualizer-canvas { position: fixed; bottom: 0; left: 0; width: 100%; height: 30%; z-index: -1; pointer-events: none; opacity: 0.3; mask-image: linear-gradient(to top, black, transparent); }
        #install-blocker.hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="fixed-background"></div>
    <canvas id="visualizer-canvas"></canvas>
    <div id="toast-container" class="fixed top-6 right-6 z-[200] flex flex-col gap-2"></div>

    <div id="install-blocker" class="hidden fixed inset-0 bg-black flex flex-col items-center justify-center p-8 text-center z-[9999]">
        <h2 class="text-3xl font-bold mb-4">Aura App</h2>
        <p class="text-gray-400 mb-6">Install for full experience.</p>
        <button onclick="window.location.reload()" class="text-sm underline text-white opacity-60">Tap if installed</button>
    </div>

    <div id="audio-player-container"><audio id="audioPlayer" playsinline preload="auto" crossorigin="anonymous"></audio></div>
    <audio id="ambientPlayerRain" loop hidden src="https://assets.mixkit.co/active_storage/sfx/2515/2515-preview.m4a"></audio>

    <div class="container-app max-w-4xl mx-auto px-4 pt-6">
        <header class="flex justify-between items-center mb-6">
            <div class="flex items-center gap-3 cursor-pointer" onclick="showSection('music')">
                <img src="https://raw.githubusercontent.com/ryzn-eu/AuraEU/main/Image/logo.png" class="h-8 w-auto object-contain" alt="Aura Logo">
            </div>
            <div class="flex gap-2">
                <button onclick="showSection('playlists')" class="p-2.5 glass-panel rounded-full hover:bg-white/10"><i data-lucide="list-music" class="w-5 h-5"></i></button>
                <button onclick="openSearchModal()" class="p-2.5 glass-panel rounded-full hover:bg-white/10"><i data-lucide="search" class="w-5 h-5"></i></button>
                <button onclick="loggedInUser ? showSection('profile') : openAuthModal()" class="p-2.5 glass-panel rounded-full relative hover:bg-white/10">
                    <i data-lucide="user" class="w-5 h-5"></i>
                    <div id="auth-dot" class="hidden absolute top-0 right-0 w-2.5 h-2.5 bg-green-500 rounded-full border-2 border-black"></div>
                </button>
            </div>
        </header>

        <main>
            <section id="music-section" class="section-page active">
                <div id="stories-container" class="stories-scroll-container"></div>

                <h2 id="home-greeting" class="text-2xl font-bold mb-4 px-1">Good Evening</h2>
                <div id="home-history-grid" class="yt-grid-mobile-fix mb-8"></div>
                <div id="home-widgets-container" class="space-y-8 pb-24"></div>
            </section>

            <section id="library-section" class="section-page">
                <h2 id="txt-saved-tracks" class="text-2xl font-bold mb-4">Saved Tracks</h2>
                <div id="liked-tracks-list" class="grid grid-cols-2 gap-3"></div>
            </section>

            <section id="playlists-section" class="section-page">
                <div class="flex justify-between items-center mb-4">
                    <h2 id="txt-sessions" class="text-2xl font-bold">Sessions</h2>
                    <button onclick="openCreatePlaylistModal()" class="p-2 bg-white/10 rounded-full"><i data-lucide="plus" class="w-5 h-5"></i></button>
                </div>
                <div id="playlists-list" class="grid grid-cols-2 gap-3 pb-24"></div>
            </section>

            <section id="profile-section" class="section-page">
                <div class="glass-panel p-6 rounded-3xl mb-6 text-center">
                    <h3 id="profile-info" class="text-xl font-bold mt-2">Guest</h3>
                    <div class="flex justify-center gap-3 flex-wrap mt-4">
                        <button id="btn-logout" onclick="handleLogout()" class="text-xs bg-red-500/10 text-red-400 px-4 py-2 rounded-lg font-bold border border-red-500/20">Logout</button>
                    </div>
                </div>
                <h3 class="font-bold mb-3 px-2">History</h3>
                <div id="history-list" class="space-y-2 pb-24"></div>
            </section>
        </main>
    </div>

    <div id="immersive-mode" class="fixed inset-0 z-[150] hidden flex flex-col justify-between p-6 pb-10 overflow-y-auto">
        <div class="flex justify-between items-center mt-2">
            <button onclick="exitImmersiveMode()" class="p-3 bg-white/5 rounded-full"><i data-lucide="chevron-down" class="w-6 h-6"></i></button>
            <span class="text-[10px] font-bold tracking-widest uppercase opacity-50">Now Playing</span>
            <button onclick="openShareModal()" class="p-3 bg-white/5 rounded-full"><i data-lucide="share-2" class="w-6 h-6"></i></button>
        </div>

        <div class="flex-1 flex flex-col items-center justify-center w-full">
            <div class="immersive-art-container">
                <img id="immersive-cover" src="" class="art-square" crossorigin="anonymous">
                <div id="lyrics-container" class="hidden"><p class="text-gray-500 mt-20">Loading...</p></div>
                <iframe id="immersive-video-player" class="art-square bg-black hidden" frameborder="0" allowfullscreen></iframe>
                <button id="switch-to-video-btn" onclick="toggleImmersiveVisuals()" class="hidden absolute bottom-2 right-2 bg-black/80 p-2 rounded-full border border-white/20 z-10"><i data-lucide="video" class="w-4 h-4"></i></button>
            </div>

            <div class="text-center w-full px-4 mb-6">
                <div id="immersive-title-wrapper" class="w-full h-10 flex justify-center items-center">
                    <h2 id="immersive-title" class="text-2xl font-bold smart-scroller">Choose Track</h2>
                </div>
                <button onclick="openArtistProfile()" class="mt-1 flex items-center justify-center gap-1 mx-auto opacity-70 hover:opacity-100 transition">
                     <p id="immersive-artist" class="text-lg text-gray-300 font-medium">Artist</p>
                     <i data-lucide="info" class="w-3 h-3 text-cyan-400"></i>
                </button>
            </div>

            <div class="w-full max-w-sm px-2 mb-8 group" id="progress-bar-immersive-container">
                <div class="w-full h-1.5 bg-white/10 rounded-full overflow-hidden relative cursor-pointer">
                    <div id="progress-bar-immersive" class="h-full bg-gradient-to-r from-violet-500 to-cyan-400 w-0 relative">
                        <div class="absolute right-0 top-1/2 -translate-y-1/2 w-3 h-3 bg-white rounded-full scale-0 group-hover:scale-100 transition-transform"></div>
                    </div>
                </div>
            </div>

            <div class="flex items-center justify-between w-full max-w-[280px] mb-8">
                <button onclick="toggleLoop()" class="opacity-50"><i data-lucide="repeat" class="w-5 h-5"></i></button>
                <button onclick="skipBackward()"><i data-lucide="skip-back" class="w-8 h-8 fill-current"></i></button>
                <button onclick="togglePlayPause()" class="w-16 h-16 bg-white text-black rounded-full flex items-center justify-center shadow-lg hover:scale-105 transition">
                    <i id="immersive-play-icon" data-lucide="play" class="w-7 h-7 fill-current ml-1"></i>
                </button>
                <button onclick="skipForward()"><i data-lucide="skip-forward" class="w-8 h-8 fill-current"></i></button>
                <div class="flex flex-col gap-1 items-center">
                    <button onclick="toggleLike()" id="like-button-immersive" class="opacity-50 hover:text-red-500"><i data-lucide="heart" class="w-5 h-5"></i></button>
                    <button onclick="openAddToPlaylistModal()" class="opacity-50 hover:text-white"><i data-lucide="list-plus" class="w-5 h-5"></i></button>
                </div>
            </div>

            <div class="controls-pill">
                <button onclick="toggleAmbientMenu()" id="btn-ambient" class="pill-btn"><i data-lucide="cloud-rain" class="w-5 h-5"></i><span>Focus</span></button>
                <button onclick="toggleLyrics()" id="btn-lyrics" class="pill-btn"><i data-lucide="mic-2" class="w-5 h-5"></i><span>Lyrics</span></button>
                <button onclick="toggleGyro()" id="btn-gyro" class="pill-btn"><i data-lucide="smartphone" class="w-5 h-5"></i><span>Gyro</span></button>
                <button onclick="openCapsuleModal()" class="pill-btn"><i data-lucide="hourglass" class="w-5 h-5"></i><span>Capsule</span></button>
            </div>
        </div>
    </div>

    <div onclick="enterImmersiveMode()" class="player-bar-new cursor-pointer">
        <div class="flex items-center gap-3 flex-1 overflow-hidden">
            <img id="player-cover" src="https://via.placeholder.com/64" class="w-10 h-10 rounded-lg object-cover bg-white/10" crossorigin="anonymous">
            <div class="flex flex-col overflow-hidden">
                <div id="player-title-wrapper" class="w-32 overflow-hidden h-5"><p id="player-title" class="text-sm font-bold truncate">Not Playing</p></div>
                <p id="player-artist" class="text-xs text-gray-400 truncate">Tap to play</p>
            </div>
        </div>
        <div class="flex items-center gap-4">
             <button onclick="event.stopPropagation(); togglePlayPause()" class="w-10 h-10 rounded-full bg-white text-black flex items-center justify-center">
                <i id="play-icon" data-lucide="play" class="w-4 h-4 fill-current ml-0.5"></i>
             </button>
        </div>
        <div class="absolute bottom-0 left-4 right-4 h-[2px] bg-white/10 rounded-full overflow-hidden">
            <div id="progress-bar" class="h-full bg-cyan-400 w-0"></div>
        </div>
    </div>

    <div id="story-modal" class="fixed inset-0 bg-black z-[250] hidden flex flex-col animate-fadeIn">
        <div class="absolute top-0 left-0 right-0 z-20 p-4 flex justify-between items-start bg-gradient-to-b from-black/80 to-transparent">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-full bg-gradient-to-br from-violet-500 to-cyan-400 p-[1px]">
                     <div class="w-full h-full bg-black rounded-full flex items-center justify-center text-lg" id="story-viewer-emoji"></div>
                </div>
                <div>
                    <h3 id="story-viewer-username" class="font-bold text-sm">Username</h3>
                    <p id="story-viewer-time" class="text-[10px] opacity-60">Just now</p>
                </div>
            </div>
            <button onclick="closeStory()" class="p-2 bg-white/10 rounded-full backdrop-blur"><i data-lucide="x" class="w-6 h-6"></i></button>
        </div>
        <div class="flex-1 relative bg-gray-900 flex items-center justify-center">
            <video id="story-video" class="w-full h-full object-cover" playsinline loop></video>
        </div>
        <div class="absolute bottom-0 left-0 right-0 z-20 p-6 pb-12 bg-gradient-to-t from-black via-black/80 to-transparent">
             <p id="story-viewer-text" class="text-sm font-medium mb-4 leading-relaxed"></p>
        </div>
    </div>

    <div id="artist-modal" class="fixed inset-0 bg-black/95 backdrop-blur-xl z-[220] hidden overflow-y-auto">
        <div class="relative min-h-screen flex flex-col items-center p-6 pt-12 animate-fadeIn">
            <button onclick="closeArtistModal()" class="absolute top-6 right-6 p-2 bg-white/10 rounded-full z-10 hover:bg-white/20 transition"><i data-lucide="x" class="w-6 h-6"></i></button>
            <img id="artist-modal-image" src="" class="w-40 h-40 rounded-full object-cover shadow-[0_0_50px_rgba(139,92,246,0.4)] mb-6 border-2 border-white/10">
            <h2 id="artist-modal-name" class="text-3xl font-bold mb-1 text-center bg-clip-text text-transparent bg-gradient-to-r from-white to-gray-400"></h2>
            <p id="artist-modal-genre" class="text-[10px] font-bold text-cyan-400 uppercase tracking-[0.2em] mb-8 border border-cyan-500/30 px-3 py-1 rounded-full"></p>
            <div class="w-full max-w-md bg-white/5 p-6 rounded-2xl border border-white/5 mb-6">
                <p id="artist-modal-bio" class="text-sm text-gray-300 leading-relaxed text-justify opacity-90"></p>
            </div>
            <a id="artist-modal-social" href="#" target="_blank" class="flex items-center gap-3 bg-gradient-to-r from-pink-600 to-purple-600 px-8 py-3 rounded-full font-bold shadow-lg hover:scale-105 transition hover:shadow-purple-500/50 mb-8">
                <i data-lucide="instagram" class="w-5 h-5"></i> <span>Instagram</span>
            </a>
            <div class="w-full max-w-md pb-12">
                <div id="artist-albums-container" class="mb-6 hidden">
                    <h3 class="text-xl font-bold mb-4 border-b border-white/10 pb-2">Albums</h3>
                    <div id="artist-albums-list" class="flex overflow-x-auto gap-4 pb-4"></div>
                </div>
                <div id="artist-singles-container" class="hidden">
                    <h3 class="text-xl font-bold mb-4 border-b border-white/10 pb-2">Singles & Tracks</h3>
                    <div id="artist-singles-list" class="space-y-3"></div>
                </div>
            </div>
        </div>
    </div>

    <div id="auth-modal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-[200] hidden flex items-center justify-center p-6"><div class="glass-panel p-8 rounded-3xl w-full max-w-sm text-center"><h2 class="text-2xl font-bold mb-2">Welcome</h2><button onclick="handleAuthAction()" class="w-full py-3 bg-white text-black rounded-xl font-bold mt-4">Login Guest</button><button onclick="closeAuthModal()" class="mt-4 text-xs opacity-50">Close</button></div></div>
    <div id="capsule-modal" class="fixed inset-0 bg-black/80 z-[200] hidden flex items-center justify-center p-6"><div class="glass-panel p-8 rounded-3xl w-full max-w-sm border border-amber-500/30 text-center"><h3 class="text-xl font-bold">Time Capsule</h3><p class="text-xs text-gray-400 mb-4">Seal this track.</p><button onclick="confirmTimeCapsule()" class="bg-amber-600 w-full py-2 rounded-lg font-bold">Seal</button><button onclick="closeCapsuleModal()" class="mt-3 text-xs opacity-50">Close</button></div></div>
    <div id="share-modal" class="fixed inset-0 bg-black/90 z-[210] hidden flex flex-col items-center justify-center p-6"><div id="share-card-content" class="w-64 bg-gray-900 rounded-xl p-4 flex flex-col items-center border border-white/10"><img id="share-card-cover" src="" class="w-32 h-32 rounded-full mb-4"><h2 id="share-card-title" class="font-bold text-center text-sm"></h2><div id="share-qr-container" class="mt-4 bg-white p-1 rounded"></div></div><button onclick="closeShareModal()" class="mt-6 text-sm opacity-50">X</button></div>
    <div id="search-modal" class="fixed inset-0 bg-black/90 z-[200] hidden flex flex-col p-4"><div class="flex gap-2 mb-4"><input type="text" id="search-input" oninput="performSearch()" placeholder="Search artist or track..." class="flex-1 bg-white/10 p-3 rounded-xl text-white outline-none"><button onclick="closeSearchModal()" class="p-3">X</button></div><div id="search-results" class="flex-1 overflow-y-auto space-y-2"></div></div>
    <div id="create-playlist-modal" class="fixed inset-0 bg-black/80 z-[200] hidden flex items-center justify-center p-6"><div class="glass-panel p-6 rounded-2xl w-full max-w-sm"><h3>New Session</h3><input type="text" id="playlist-name-input" class="w-full p-3 rounded-xl bg-white/10 mt-2 mb-4 text-white"><button onclick="createPlaylist()" class="bg-white text-black px-4 py-2 rounded-lg font-bold">Create</button><button onclick="closeCreatePlaylistModal()" class="ml-2 text-xs">Cancel</button></div></div>

        let AURA_MAP = [], ARTISTS_FULL_LIST = [], currentTrackData = null, audioPlayer = null, isLooping = false, likedTracks = new Set(), userPlaylists = [], listeningHistory = [], loggedInUser = null;
        let isLyricsMode = false, currentLyrics = [];

        document.addEventListener('DOMContentLoaded', () => {
            getDOMElements();
            loadLocalData();
            processTracks(); // Sync Load
            lucide.createIcons();
            showSection('music');
        });

        function getDOMElements() {
            audioPlayer = document.getElementById('audioPlayer');
            audioPlayer.addEventListener('timeupdate', () => { updateProgress(); syncLyrics(); });
            audioPlayer.addEventListener('ended', () => { if(!isLooping) skipForward(); else { audioPlayer.currentTime=0; audioPlayer.play(); } });
            audioPlayer.addEventListener('play', () => { document.querySelector('.player-bar-new').classList.add('active'); document.querySelectorAll('#play-icon, #immersive-play-icon').forEach(i=>i.setAttribute('data-lucide','pause')); lucide.createIcons(); });
            audioPlayer.addEventListener('pause', () => { document.querySelectorAll('#play-icon, #immersive-play-icon').forEach(i=>i.setAttribute('data-lucide','play')); lucide.createIcons(); });
            document.getElementById('progress-bar-immersive-container').addEventListener('click', (e) => {
                const rect = e.currentTarget.getBoundingClientRect();
                if(audioPlayer.duration) audioPlayer.currentTime = ((e.clientX - rect.left) / rect.width) * audioPlayer.duration;
            });
        }

        function processTracks() {
            ARTISTS_FULL_LIST = LOCAL_ARTISTS;
            const artistMap = {};
            ARTISTS_FULL_LIST.forEach(a => artistMap[a.id] = a.name);

            AURA_MAP = LOCAL_TRACKS.map(t => {
                let coverUrl = "https://via.placeholder.com/300";
                if(t.albumId) coverUrl = GITHUB_RAW_BASE + "Covers/" + encodeURIComponent(t.albumId.trim()) + ".png";
                else if (t.categoryID) coverUrl = GITHUB_RAW_BASE + "Covers/" + t.categoryID + ".png";

                return {
                    id: t.id || t.title.trim(),
                    title: t.title.trim(),
                    artist: artistMap[t.artistId] || t.artist || "Unknown Artist",
                    artistId: t.artistId, albumId: t.albumId, albumTitle: t.albumTitle,
                    audioUrl: GITHUB_RAW_BASE + "audio/" + encodeURIComponent(t.file.replace(/\s(\.[a-z0-9]+)$/i, '$1')),
                    cover: coverUrl, categoryID: t.categoryID, videoUrl: t.videoUrl, lrcUrl: t.lrcUrl, status: t.Status
                };
            });
            renderStories();
            renderHomePageWidgets();
            renderHistoryGrid();
        }

        // --- PLAYBACK ---
        window.playTrack = (id) => {
            const t = AURA_MAP.find(x => x.id === id);
            if(!t) return;
            currentTrackData = t;
            audioPlayer.src = t.audioUrl;
            audioPlayer.play().catch(e => console.log(e));
            
            // Lyrics Reset
            currentLyrics = []; isLyricsMode = false;
            document.getElementById('lyrics-container').classList.add('hidden');
            document.getElementById('immersive-cover').classList.remove('hidden');
            if(t.lrcUrl) fetchLyrics(t.lrcUrl);

            updateUI(t);
            listeningHistory = [id, ...listeningHistory.filter(x => x !== id)].slice(0, 20);
            saveLocalData();
            renderHistoryGrid();
        };

        function updateUI(t) {
            document.querySelectorAll('#player-title, #immersive-title, #share-card-title').forEach(e => e.innerText = t.title);
            document.querySelectorAll('#player-artist, #immersive-artist, #share-card-artist').forEach(e => e.innerText = t.artist);
            document.querySelectorAll('#player-cover, #immersive-cover, #share-card-cover').forEach(e => e.src = t.cover);
            
            // Smart Marquee - Logic from Turn 2
            const titleEl = document.getElementById('immersive-title');
            const wrapper = document.getElementById('immersive-title-wrapper');
            titleEl.classList.remove('scrolling'); titleEl.style.transform = 'translateX(0)';
            // Force redraw
            void titleEl.offsetWidth;
            
            if(titleEl.scrollWidth > wrapper.clientWidth) {
                const distance = titleEl.scrollWidth - wrapper.clientWidth + 20; // + buffer
                titleEl.style.setProperty('--scroll-distance', `-${distance}px`);
                titleEl.classList.add('scrolling');
            }

            const img = new Image(); img.crossOrigin = "anonymous"; img.src = t.cover;
            img.onload = () => { try { const c = new ColorThief().getColor(img); document.documentElement.style.setProperty('--primary', `rgb(${c[0]},${c[1]},${c[2]})`); } catch(e){} };
        }

        // --- RENDERERS ---
        function renderStories() {
            document.getElementById('stories-container').innerHTML = USER_VIDEOS.map(s => `
                <div class="story-item" onclick="openStory(${s.id})">
                    <div class="story-bubble"><div class="story-inner">${STORY_EMOJIS[s.id]||"✨"}</div></div>
                    <span class="story-username">${s.userName}</span>
                </div>`).join('');
        }

        function renderHistoryGrid() {
            const list = listeningHistory.slice(0, 6).map(id => AURA_MAP.find(x => x.id === id)).filter(Boolean);
            const items = list.length ? list : AURA_MAP.filter(t=>t.categoryID==='CR1').slice(0,6);
            document.getElementById('home-history-grid').innerHTML = items.map(t => 
                `<div onclick="playTrack(this.dataset.id)" data-id="${t.id.replace(/"/g, '&quot;')}" class="yt-card"><img src="${t.cover}" class="yt-img"><div class="yt-info"><div class="yt-title">${t.title}</div><div class="yt-artist">${t.artist}</div></div></div>`
            ).join('');
        }

        function renderHomePageWidgets() {
            let html = "";
            const newRelease = AURA_MAP.find(t => t.status === "New");
            if (newRelease) {
                html += `<div class="mb-8"><h3 class="widget-block-title">Official New Release</h3>
                <div onclick="playTrack(this.dataset.id)" data-id="${newRelease.id.replace(/"/g, '&quot;')}" class="relative w-full h-48 rounded-2xl overflow-hidden cursor-pointer shadow-lg">
                    <img src="${newRelease.cover}" class="absolute inset-0 w-full h-full object-cover opacity-60 blur-sm">
                    <div class="absolute inset-0 bg-gradient-to-r from-black via-black/50 to-transparent"></div>
                    <div class="absolute inset-0 p-5 flex items-center gap-5"><img src="${newRelease.cover}" class="w-32 h-32 rounded-xl shadow-2xl z-10"><div class="z-10"><span class="bg-red-500 text-white text-[10px] font-bold px-2 py-1 rounded-md mb-2 inline-block">NEW</span><h4 class="text-2xl font-bold text-white mb-1">${newRelease.title}</h4><p class="text-gray-300">${newRelease.artist}</p></div></div>
                </div></div>`;
            }

            let rec = [];
            if(listeningHistory.length) {
                 const last = AURA_MAP.find(t=>t.id === listeningHistory[0]);
                 if(last) rec = AURA_MAP.filter(t => t.categoryID === last.categoryID && t.id !== last.id).slice(0, 8);
            }
            if(!rec.length) rec = AURA_MAP.slice(0, 8);
            html += createWidgetBlock("Recommended", rec);
            html += createWidgetBlock("Trending Now", AURA_MAP.filter(t => t.categoryID === 'CR1').slice(0, 8));
            
            // WIDGETS FAKE logic from Turn 2
            const visitors = Math.floor(Math.random() * 15000) + 10200; 
            const globalLikes = (2840000 + Math.floor(Date.now() / 5000)).toLocaleString();

            html += `<div class="ios-widget-row"><div class="ios-card"><div class="ios-content"><div class="p-2 bg-white/10 rounded-full w-max"><i data-lucide="globe" class="w-4 h-4 text-green-400"></i></div><div><p class="text-2xl font-bold">${visitors.toLocaleString()}</p><p class="text-[10px] text-gray-400"><span class="live-dot"></span>Online</p></div></div></div><div class="ios-card" onclick="showSection('library')"><div class="ios-content"><div class="p-2 bg-white/10 rounded-full w-max"><i data-lucide="heart" class="w-4 h-4 text-red-400"></i></div><div><p class="text-2xl font-bold">${globalLikes}</p><p class="text-[10px] text-gray-400">Global Likes</p></div></div></div></div>`;
            
            html += createWidgetBlock("Relax & Chill", AURA_MAP.filter(t => t.categoryID === 'CR2').slice(0, 8));
            html += createWidgetBlock("Classics", AURA_MAP.filter(t => t.categoryID === 'CR3').slice(0, 8));
            
            document.getElementById('home-widgets-container').innerHTML = html;
            lucide.createIcons();
        }

        function createWidgetBlock(title, tracks) {
            if(!tracks.length) return '';
            return `<div><h3 class="widget-block-title">${title}</h3><div class="horizontal-scroll">${tracks.map(t => 
                `<div onclick="playTrack(this.dataset.id)" data-id="${t.id.replace(/"/g, '&quot;')}" class="flex-none w-36 cursor-pointer group"><div class="relative"><img src="${t.cover}" class="w-36 h-36 rounded-xl object-cover mb-2 shadow-lg"><div class="absolute inset-0 bg-black/20 hidden group-hover:flex items-center justify-center rounded-xl"><i data-lucide="play" class="fill-white text-white"></i></div></div><p class="text-xs font-bold truncate">${t.title}</p><p class="text-[10px] text-gray-400 truncate">${t.artist}</p></div>`
            ).join('')}</div></div>`;
        }

        // --- STORY LOGIC ---
        window.openStory = (id) => {
            const s = USER_VIDEOS.find(x => x.id === id);
            if(!s) return;
            const modal = document.getElementById('story-modal');
            const v = document.getElementById('story-video');
            document.getElementById('story-viewer-username').innerText = s.userName;
            document.getElementById('story-viewer-time').innerText = s.timestamp;
            document.getElementById('story-viewer-text').innerText = s.text;
            document.getElementById('story-viewer-emoji').innerText = STORY_EMOJIS[s.id];
            v.src = s.videoUrl;
            modal.classList.remove('hidden');
            v.play().catch(e => console.log(e));
        };
        window.closeStory = () => {
            const v = document.getElementById('story-video');
            v.pause(); v.currentTime = 0;
            document.getElementById('story-modal').classList.add('hidden');
        };

        // --- ARTIST PROFILE ---
        window.openArtistProfile = (id=null) => {
            let artist = null;
            if (id) artist = ARTISTS_FULL_LIST.find(a => a.id === id);
            else if(currentTrackData) artist = ARTISTS_FULL_LIST.find(a => (currentTrackData.artistId && a.id === currentTrackData.artistId) || a.name === currentTrackData.artist);
            
            if(!artist) return showToast("Artist info unavailable");
            
            document.getElementById('artist-modal-name').innerText = artist.name;
            document.getElementById('artist-modal-bio').innerText = artist.bio;
            document.getElementById('artist-modal-genre').innerText = artist.genre;
            document.getElementById('artist-modal-image').src = artist.imageUrl;
            
            const tracks = AURA_MAP.filter(t => (t.artistId && t.artistId === artist.id) || t.artist === artist.name);
            const albums = {}, singles = [];
            tracks.forEach(t => t.albumId ? (albums[t.albumTitle] = albums[t.albumTitle] || []).push(t) : singles.push(t));

            const albCont = document.getElementById('artist-albums-container');
            if(Object.keys(albums).length) {
                albCont.classList.remove('hidden');
                document.getElementById('artist-albums-list').innerHTML = Object.keys(albums).map(k => `<div onclick="playTrack(this.dataset.id); closeArtistModal()" data-id="${albums[k][0].id.replace(/"/g, '&quot;')}" class="flex-none w-32 cursor-pointer"><img src="${albums[k][0].cover}" class="w-32 h-32 rounded-lg object-cover mb-2"><p class="text-xs font-bold">${k}</p></div>`).join('');
            } else albCont.classList.add('hidden');

            const singCont = document.getElementById('artist-singles-container');
            const list = Object.keys(albums).length ? singles : tracks;
            if(list.length) {
                singCont.classList.remove('hidden');
                document.getElementById('artist-singles-list').innerHTML = list.map(t => `<div onclick="playTrack(this.dataset.id); closeArtistModal()" data-id="${t.id.replace(/"/g, '&quot;')}" class="flex items-center gap-3 p-3 bg-white/5 rounded-xl cursor-pointer"><img src="${t.cover}" class="w-10 h-10 rounded-lg"><div class="flex-1"><p class="text-sm font-bold">${t.title}</p></div></div>`).join('');
            } else singCont.classList.add('hidden');

            document.getElementById('artist-modal').classList.remove('hidden');
        };
        window.closeArtistModal = () => document.getElementById('artist-modal').classList.add('hidden');

        // --- LYRICS ---
        async function fetchLyrics(url) {
            try {
                const txt = await (await fetch(url)).text();
                const regex = /\[(\d{2}):(\d{2})\.(\d{2,3})\](.*)/;
                currentLyrics = txt.split('\n').map(l => { const m=l.match(regex); return m ? {time: parseInt(m[1])*60+parseInt(m[2])+parseInt(m[3])/100, text: m[4].trim()} : null; }).filter(Boolean);
                renderLyrics();
            } catch(e) { document.getElementById('lyrics-container').innerHTML = '<p class="text-red-500 mt-20">No Lyrics</p>'; }
        }
        function renderLyrics() {
            document.getElementById('lyrics-container').innerHTML = '<div style="height:50%"></div>' + currentLyrics.map((l,i) => `<p id="lyric-${i}" class="lyric-line" onclick="audioPlayer.currentTime=${l.time}">${l.text}</p>`).join('') + '<div style="height:50%"></div>';
        }
        function syncLyrics() {
            if(!isLyricsMode || !currentLyrics.length) return;
            const t = audioPlayer.currentTime;
            let idx = currentLyrics.findIndex(l => l.time > t) - 1;
            if(idx < 0) idx = currentLyrics.length - 1; 
            document.querySelectorAll('.lyric-line').forEach(e => e.classList.remove('active'));
            const el = document.getElementById(`lyric-${idx}`);
            if(el) { el.classList.add('active'); el.scrollIntoView({behavior:"smooth", block:"center"}); }
        }
        window.toggleLyrics = () => {
            isLyricsMode = !isLyricsMode;
            document.getElementById('lyrics-container').classList.toggle('hidden', !isLyricsMode);
            document.getElementById('immersive-cover').classList.toggle('hidden', isLyricsMode);
        };

        // --- UTILS ---
        window.showSection=(id)=>{ document.querySelectorAll('.section-page').forEach(e=>e.classList.remove('active')); document.getElementById(id+'-section').classList.add('active'); if(id==='music') renderHistoryGrid(); if(id==='playlists') renderPlaylists(); };
        window.enterImmersiveMode=()=>document.getElementById('immersive-mode').classList.remove('hidden');
        window.exitImmersiveMode=()=>document.getElementById('immersive-mode').classList.add('hidden');
        window.updateProgress=()=>{ if(audioPlayer.duration) document.querySelectorAll('#progress-bar, #progress-bar-immersive').forEach(e=>e.style.width=(audioPlayer.currentTime/audioPlayer.duration*100)+'%'); };
        window.skipForward=()=>{ if(currentTrackData){ const i=AURA_MAP.findIndex(x=>x.id===currentTrackData.id); playTrack(AURA_MAP[(i+1)%AURA_MAP.length].id); } };
        window.skipBackward=()=>{ if(currentTrackData){ const i=AURA_MAP.findIndex(x=>x.id===currentTrackData.id); playTrack(AURA_MAP[(i-1+AURA_MAP.length)%AURA_MAP.length].id); } };
        window.togglePlayPause=()=>audioPlayer.paused?audioPlayer.play():audioPlayer.pause();
        window.toggleLoop=()=>{ isLooping=!isLooping; showToast(isLooping?"Loop On":"Loop Off"); };
        window.toggleLike=()=>{ 
            if(likedTracks.has(currentTrackData.id)) likedTracks.delete(currentTrackData.id); 
            else likedTracks.add(currentTrackData.id); 
            showToast(likedTracks.has(currentTrackData.id)?"Saved":"Removed"); 
            renderLikedTracks();
            renderPlaylists(); // update playlist view
        };
        function renderLikedTracks(){document.getElementById('liked-tracks-list').innerHTML=Array.from(likedTracks).map(id=>{const t=AURA_MAP.find(x=>x.id===id);return createYtCard(t)}).join('');}
        window.showToast=(m)=>{ const t=document.createElement('div'); t.className="bg-white/10 backdrop-blur-md px-4 py-2 rounded-xl text-xs font-bold border border-white/20"; t.innerText=m; document.getElementById('toast-container').appendChild(t); setTimeout(()=>t.remove(),2000); };
        
        // --- DATA & SEARCH ---
        function saveLocalData(){ localStorage.setItem('aura_hist',JSON.stringify(listeningHistory)); localStorage.setItem('aura_playlists',JSON.stringify(userPlaylists)); }
        function loadLocalData(){ listeningHistory=JSON.parse(localStorage.getItem('aura_hist')||'[]'); userPlaylists=JSON.parse(localStorage.getItem('aura_playlists')||'[]'); loggedInUser=JSON.parse(localStorage.getItem('aura_user')||'null'); updateAuthUI(); }
        window.performSearch=()=>{ const q=document.getElementById('search-input').value.toLowerCase(); 
            let html = "";
            const artistMatch = ARTISTS_FULL_LIST.find(a => a.name.toLowerCase().includes(q) && q.length > 1);
            if(artistMatch) html += `<div onclick="openArtistProfile('${artistMatch.id}'); closeSearchModal()" class="flex items-center gap-3 p-3 bg-gradient-to-r from-violet-900/50 to-blue-900/50 border border-violet-500/30 rounded-xl cursor-pointer mb-2"><img src="${artistMatch.imageUrl}" class="w-12 h-12 rounded-full border-2 border-white/20"><div><p class="text-sm font-bold text-white">${artistMatch.name}</p><p class="text-[10px] text-cyan-300">Artist</p></div></div>`;
            html += AURA_MAP.filter(t=>t.title.toLowerCase().includes(q)).map(t=>`<div onclick="playTrack(this.dataset.id);closeSearchModal()" data-id="${t.id.replace(/"/g, '&quot;')}" class="flex items-center gap-3 p-2 border-b border-white/10 cursor-pointer"><img src="${t.cover}" class="w-8 h-8 rounded"><p class="text-sm">${t.title}</p></div>`).join(''); 
            document.getElementById('search-results').innerHTML = html;
        };
        window.openSearchModal=()=>document.getElementById('search-modal').classList.remove('hidden'); window.closeSearchModal=()=>document.getElementById('search-modal').classList.add('hidden');
        window.openShareModal=()=>document.getElementById('share-modal').classList.remove('hidden'); window.closeShareModal=()=>document.getElementById('share-modal').classList.add('hidden');
        window.openCapsuleModal=()=>document.getElementById('capsule-modal').classList.remove('hidden'); window.closeCapsuleModal=()=>document.getElementById('capsule-modal').classList.add('hidden');
        window.confirmTimeCapsule=()=>{ showToast("Sealed"); closeCapsuleModal(); };
        window.openAuthModal=()=>document.getElementById('auth-modal').classList.remove('hidden'); window.closeAuthModal=()=>document.getElementById('auth-modal').classList.add('hidden');
        window.handleAuthAction=()=>{ loggedInUser={name:"Guest"}; saveLocalData(); updateAuthUI(); closeAuthModal(); showSection('profile'); };
        window.handleLogout=()=>{ loggedInUser=null; saveLocalData(); updateAuthUI(); showToast("Logged out"); };
        
        window.openCreatePlaylistModal=()=>document.getElementById('create-playlist-modal').classList.remove('hidden'); window.closeCreatePlaylistModal=()=>document.getElementById('create-playlist-modal').classList.add('hidden');
        window.openAddToPlaylistModal=()=>{ 
            if(!currentTrackData) return; 
            const list=document.getElementById('playlist-selection-list'); 
            list.innerHTML=userPlaylists.length ? userPlaylists.map(p=>`<div onclick="toggleTrackInPlaylist(${p.id})" class="p-3 mb-2 rounded-lg cursor-pointer flex justify-between bg-white/5"><span class="text-sm">${p.name}</span>${p.tracks.includes(currentTrackData.id)?'<i data-lucide="check"></i>':'<i data-lucide="plus"></i>'}</div>`).join('') : '<p class="text-xs text-center text-gray-500">No sessions.</p>';
            document.getElementById('add-to-playlist-modal').classList.remove('hidden'); lucide.createIcons();
        };
        window.closeAddToPlaylistModal=()=>document.getElementById('add-to-playlist-modal').classList.add('hidden');
        window.createPlaylist=()=>{ const n=document.getElementById('playlist-name-input').value; if(n){ userPlaylists.push({id:Date.now(),name:n,tracks:[]}); saveLocalData(); closeCreatePlaylistModal(); renderPlaylists(); } };
        
        window.renderPlaylists=()=>{ 
            let html = "";
            // Automatic "Liked Songs" playlist card
            html += `<div onclick="showSection('library')" class="p-4 glass-panel rounded-xl cursor-pointer relative bg-gradient-to-br from-pink-900/40 to-purple-900/40 border-pink-500/30"><h3 class="font-bold flex items-center gap-2"><i data-lucide="heart" class="w-4 h-4 fill-pink-500 text-pink-500"></i> Liked Songs</h3><p class="text-xs text-gray-400">${likedTracks.size} tracks</p></div>`;
            
            html += userPlaylists.map(p=>`<div onclick="playPlaylist(${p.id})" class="p-4 glass-panel rounded-xl cursor-pointer relative"><h3 class="font-bold">${p.name}</h3><p class="text-xs text-gray-400">${p.tracks.length} tracks</p><button onclick="event.stopPropagation();deletePlaylist(${p.id})" class="absolute top-2 right-2 p-1 text-red-500"><i data-lucide="trash-2" class="w-4 h-4"></i></button></div>`).join(''); 
            
            document.getElementById('playlists-list').innerHTML = html; 
            lucide.createIcons(); 
        };
        window.playPlaylist=(id)=>{ const p=userPlaylists.find(x=>x.id===id); if(p&&p.tracks.length) playTrack(p.tracks[0]); };
        window.toggleTrackInPlaylist=(pid)=>{ const p=userPlaylists.find(x=>x.id===pid); const idx=p.tracks.indexOf(currentTrackData.id); idx>-1?p.tracks.splice(idx,1):p.tracks.push(currentTrackData.id); saveLocalData(); openAddToPlaylistModal(); renderPlaylists(); };
        window.deletePlaylist=(id)=>{ if(confirm("Delete?")){ userPlaylists=userPlaylists.filter(x=>x.id!==id); saveLocalData(); renderPlaylists(); } };
        
        function updateAuthUI() { 
            if(loggedInUser) { document.getElementById('auth-dot').classList.remove('hidden'); document.getElementById('profile-info').innerText = "User: Guest"; } 
            else { document.getElementById('auth-dot').classList.add('hidden'); document.getElementById('profile-info').innerText = "Guest"; }
        }
    </script>
</body>
</html>
