<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aura</title>
    
    <link rel="icon" href="https://via.placeholder.com/192x192">
    <link rel="apple-touch-icon" href="https://via.placeholder.com/192x192">
    <meta name="theme-color" content="#171717">

    <link rel="manifest" href="./manifest.json">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <style>
        /* STILI BASE ORIGINALI */
        :root { --ryzn-color-hex: #00BFFF; --ryzn-color-rgb: 0 191 255; --ryzn-bg-color: #171717; }
        .ryzn-bg { background-color: var(--ryzn-bg-color); }
        .accent-text { color: var(--ryzn-color-hex); }
        .accent-bg { background-color: var(--ryzn-color-hex); }
        .depth-glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .premium-gold { background: linear-gradient(135deg, #FFD700 0%, #B8860B 100%); position: relative; overflow: hidden; }
        .premium-shine { position: absolute; top: 0; left: 0; width: 80%; height: 100%; background: linear-gradient(to right, transparent 0%, rgba(255, 255, 255, 0.4) 50%, transparent 100%); transform: skewX(-20deg); animation: shimmer 3s infinite; pointer-events: none; z-index: 10; }
        @keyframes shimmer { 0%, 100% { transform: translateX(-150%) skewX(-20deg); } 50% { transform: translateX(150%) skewX(-20deg); } }
        .fixed-background { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2; background-image: url('https://raw.githubusercontent.com/ryzn-eu/AuraEU/main/User/Foto.png'); background-size: cover; background-position: center; pointer-events: none; }
        body { background-color: transparent; color: white; min-height: 100vh; display: flex; flex-direction: column; padding-bottom: 96px; overflow-x: hidden; position: relative; }
        body::before { content: ''; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.6); z-index: -1; pointer-events: none; }
        .section-page { display: none; opacity: 0; transition: opacity 0.5s ease; } .section-page.active { display: block; opacity: 1; }
        .modal { animation: fadeIn 0.3s ease-out; } @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        /* NUOVI STILI PER IL PUNTEGGIO E SANTA */
        .score-card { background: rgba(0, 191, 255, 0.1); border: 1px solid rgba(0, 191, 255, 0.2); border-radius: 20px; padding: 15px; margin-bottom: 20px; display: flex; align-items: center; justify-content: space-between; }
        #santa-modal { transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); transform: translateY(100%); opacity: 0; }
        #santa-modal.active { transform: translateY(0); opacity: 1; }
    </style>
</head>
<body class="ryzn-bg">

    <div class="fixed-background"></div>
    <div id="snow-container" class="snow-container"></div>
    <div id="toast-container"></div>
    <div id="audio-player-container"><audio id="audioPlayer" playsinline preload="auto"></audio></div>

    <div id="santa-modal" class="fixed inset-0 bg-black z-[200] hidden flex flex-col">
        <button onclick="closeSantaTracker()" class="absolute top-6 right-6 z-[210] p-4 bg-red-600 hover:bg-red-700 text-white rounded-full shadow-2xl transition-all active:scale-95">
            <i data-lucide="x" class="w-8 h-8"></i>
        </button>
        <iframe id="santa-frame" src="" class="w-full h-full border-none" allow="autoplay"></iframe>
    </div>

    <div class="container-app mx-auto p-4 max-w-4xl">
        
        <section id="music" class="section-page active">
            <div class="flex items-center justify-between mb-8">
                <h1 class="text-4xl font-black tracking-tighter italic">AURA</h1>
                <div class="flex gap-3">
                    <button onclick="openSearchModal()" class="p-3 depth-glass rounded-full"><i data-lucide="search" class="w-5 h-5"></i></button>
                    <button onclick="openAuthModal()" class="p-3 depth-glass rounded-full"><i data-lucide="user" class="w-5 h-5"></i></button>
                </div>
            </div>

            <div class="score-card depth-glass">
                <div class="flex flex-col">
                    <span class="text-[10px] font-bold text-gray-400 uppercase tracking-widest">Global Score</span>
                    <div class="flex items-baseline gap-2">
                        <span id="current-score" class="text-3xl font-black accent-text">0</span>
                        <span class="text-xs text-gray-500">Record: <span id="high-score">0</span></span>
                    </div>
                </div>
                <div class="flex gap-2">
                    <button id="btn-play-score" onclick="startScoreCounter()" class="px-5 py-2 bg-green-500 rounded-full text-white font-bold text-xs uppercase shadow-lg shadow-green-500/20">Play</button>
                    <button id="btn-die-score" onclick="playerDie()" class="px-5 py-2 bg-red-600 rounded-full text-white font-bold text-xs uppercase hidden shadow-lg shadow-red-600/20">Die</button>
                </div>
            </div>

            <div class="promo-banner">
                <h2 class="promo-title">CHRISTMAS EVENT</h2>
                <p class="text-white/70">Il tracker di Babbo Natale è ora attivo su Aura.</p>
            </div>

            <div id="music-content" class="space-y-8">
                </div>
        </section>

        <section id="home" class="section-page"></section>
        <section id="radio" class="section-page"></section>

    </div>

    <nav class="fixed bottom-0 left-0 right-0 depth-glass h-20 px-6 flex items-center justify-around z-[100] safe-area-bottom">
        <button onclick="showSection('music')" class="flex flex-col items-center gap-1 text-white">
            <i data-lucide="music" class="w-6 h-6"></i>
            <span class="text-[10px] font-medium uppercase tracking-tighter">Vibe</span>
        </button>
        <button onclick="showSection('home')" class="flex flex-col items-center gap-1 text-gray-400">
            <i data-lucide="home" class="w-6 h-6"></i>
            <span class="text-[10px] font-medium uppercase tracking-tighter">Home</span>
        </button>
        
        <button onclick="openSantaTracker()" class="flex flex-col items-center gap-1 text-red-500 animate-pulse">
            <i data-lucide="map-pin" class="w-7 h-7"></i>
            <span class="text-[10px] font-bold uppercase tracking-tighter">Santa</span>
        </button>

        <button onclick="showSection('radio')" class="flex flex-col items-center gap-1 text-gray-400">
            <i data-lucide="radio" class="w-6 h-6"></i>
            <span class="text-[10px] font-medium uppercase tracking-tighter">Radio</span>
        </button>
    </nav>

    <script>
        // --- VARIABILI PUNTEGGIO ---
        let score = 0;
        let highScore = localStorage.getItem('aura_high_score') || 0;
        let scoreInterval = null;

        // --- FUNZIONI PUNTEGGIO ---
        function startScoreCounter() {
            if (scoreInterval) return;
            document.getElementById('btn-play-score').classList.add('hidden');
            document.getElementById('btn-die-score').classList.remove('hidden');
            
            scoreInterval = setInterval(() => {
                score += 3; // Aumenta di 3 ogni secondo
                document.getElementById('current-score').innerText = score;
            }, 1000);
        }

        function playerDie() {
            clearInterval(scoreInterval);
            scoreInterval = null;
            
            // Gestione Record
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('aura_high_score', highScore);
                document.getElementById('high-score').innerText = highScore;
            }
            
            // Reset
            score = 0;
            document.getElementById('current-score').innerText = score;
            document.getElementById('btn-play-score').classList.remove('hidden');
            document.getElementById('btn-die-score').classList.add('hidden');
        }

        // --- FUNZIONI SANTA TRACKER ---
        function openSantaTracker() {
            const modal = document.getElementById('santa-modal');
            const frame = document.getElementById('santa-frame');
            modal.classList.remove('hidden');
            setTimeout(() => modal.classList.add('active'), 10);
            if (frame.src === "" || frame.src.includes("about:blank")) {
                frame.src = "esctrack.html"; // Carica il file solo all'apertura
            }
        }

        function closeSantaTracker() {
            const modal = document.getElementById('santa-modal');
            modal.classList.remove('active');
            setTimeout(() => modal.classList.add('hidden'), 400);
        }

        // --- INIZIALIZZAZIONE ---
        function showSection(id) {
            document.querySelectorAll('.section-page').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            lucide.createIcons();
        }

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('high-score').innerText = highScore;
            lucide.createIcons();
            // Qui inseriresti initializeAppContent() originale se necessario
        });
    </script>
</body>
</html>
