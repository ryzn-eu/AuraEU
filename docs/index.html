<!DOCTYPE html>
<html lang="it" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Aura Music</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/color-thief/2.3.2/color-thief.umd.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <style>
        :root { 
            --accent: #00BFFF; 
            --accent-rgb: 0, 191, 255;
            --bg: #0a0a0a;
            --glass: rgba(255, 255, 255, 0.08);
        }

        body { 
            background-color: var(--bg); 
            color: white; 
            font-family: -apple-system, system-ui, sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        /* Effetti Grafici Restaurati */
        .glass { background: var(--glass); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px); border: 1px solid rgba(255,255,255,0.1); }
        .accent-shadow { box-shadow: 0 0 20px rgba(var(--accent-rgb), 0.3); }
        
        .section-page { display: none; padding-top: 20px; padding-bottom: 180px; animation: fadeIn 0.4s ease; }
        .section-page.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Marquee migliorato */
        .marquee { white-space: nowrap; overflow: hidden; display: block; }
        .marquee span { display: inline-block; padding-left: 100%; animation: scroll 15s linear infinite; }
        @keyframes scroll { 0% { transform: translate(0, 0); } 100% { transform: translate(-100%, 0); } }

        /* Slider Orizzontali */
        .h-scroll { display: flex; overflow-x: auto; gap: 16px; scrollbar-width: none; padding-bottom: 10px; }
        .h-scroll::-webkit-scrollbar { display: none; }
        .h-card { flex: 0 0 160px; transition: transform 0.2s; }
        .h-card:active { transform: scale(0.95); }

        /* Navigation Bottom */
        .nav-bar { position: fixed; bottom: 0; left: 0; right: 0; height: 85px; background: rgba(10,10,10,0.9); border-top: 1px solid rgba(255,255,255,0.05); z-index: 100; display: flex; justify-content: space-around; align-items: center; padding-bottom: 15px; }
        
        /* Floating Mini Player */
        .mini-player { position: fixed; bottom: 95px; left: 10px; right: 10px; height: 65px; border-radius: 20px; z-index: 99; display: none; align-items: center; padding: 0 15px; }
        .mini-player.active { display: flex; }

        /* Modali */
        .modal-full { position: fixed; inset: 0; z-index: 200; background: var(--bg); display: none; flex-direction: column; }
    </style>
</head>
<body>

    <canvas id="visualizer-canvas" class="fixed inset-0 pointer-events-none opacity-40 z-[-1]"></canvas>

    <div id="install-blocker" class="fixed inset-0 z-[1000] glass flex items-center justify-center p-8 text-center hidden">
        <div class="space-y-6">
            <h2 class="text-3xl font-black">INSTALLA AURA</h2>
            <p class="text-gray-400">Per la riproduzione continua in background e un'esperienza full-screen.</p>
            <button onclick="window.location.reload()" class="px-8 py-4 bg-white text-black rounded-full font-bold">Ho già installato l'app</button>
        </div>
    </div>

    <div class="max-w-xl mx-auto px-5">
        
        <header class="flex justify-between items-center py-6">
            <img src="https://raw.githubusercontent.com/ryzn-eu/AuraEU/main/Image/logo.png" class="h-8" alt="Aura">
            <div class="flex gap-4">
                <button onclick="openSearch()" class="p-2 glass rounded-full"><i data-lucide="search"></i></button>
                <button id="auth-btn" onclick="showSection('profile')" class="p-2 glass rounded-full"><i data-lucide="user"></i></button>
            </div>
        </header>

        <main id="music-section" class="section-page active">
            <h1 id="greeting" class="text-4xl font-black mb-8">Good Evening.</h1>
            <div id="home-content" class="space-y-12">
                </div>
        </main>

        <section id="library-section" class="section-page">
            <h2 class="text-3xl font-bold mb-6">Saved Tracks</h2>
            <div id="liked-tracks-list" class="space-y-4"></div>
        </section>

        <section id="profile-section" class="section-page">
            <h2 class="text-3xl font-bold mb-6">Profile</h2>
            <div class="glass p-6 rounded-3xl space-y-6">
                <div class="flex items-center gap-4">
                    <div id="pfp" class="w-16 h-16 rounded-full bg-gradient-to-br from-blue-400 to-indigo-600 flex items-center justify-center text-2xl font-bold">U</div>
                    <div>
                        <p id="user-id" class="font-bold">Guest Account</p>
                        <p id="vibe-score" class="text-sm text-blue-400">Vibe Score: 0/100</p>
                    </div>
                </div>
                <div class="space-y-2">
                    <label class="text-xs text-gray-500 uppercase font-bold px-2">Language</label>
                    <select id="lang-select" onchange="changeLanguage(this.value)" class="w-full bg-white/5 p-4 rounded-2xl border border-white/10 outline-none">
                        <option value="en">English</option>
                        <option value="it">Italiano</option>
                        <option value="ro">Română</option>
                    </select>
                </div>
                <button onclick="handleLogout()" class="w-full p-4 bg-red-500/10 text-red-500 rounded-2xl font-bold">Logout</button>
            </div>
        </section>
    </div>

    <div id="mini-player" class="mini-player glass accent-shadow" onclick="openImmersive()">
        <img id="mini-cover" class="w-12 h-12 rounded-xl object-cover" src="">
        <div class="flex-grow mx-4 overflow-hidden">
            <div id="mini-title-wrap" class="font-bold text-sm truncate">Seleziona Brano</div>
            <div id="mini-artist" class="text-xs text-gray-400 truncate">Aura Choice</div>
        </div>
        <button onclick="event.stopPropagation(); togglePlay()" class="p-2"><i id="mini-play-icon" data-lucide="play"></i></button>
    </div>

    <nav class="nav-bar">
        <button onclick="showSection('music')" class="flex flex-col items-center gap-1"><i data-lucide="home"></i><span class="text-[10px]">Home</span></button>
        <button onclick="showSection('library')" class="flex flex-col items-center gap-1"><i data-lucide="heart"></i><span class="text-[10px]">Likes</span></button>
        <button onclick="showSection('profile')" class="flex flex-col items-center gap-1"><i data-lucide="user"></i><span class="text-[10px]">Profile</span></button>
    </nav>

    <div id="player-modal" class="modal-full p-8 transition-all duration-500">
        <button onclick="closeImmersive()" class="mb-10"><i data-lucide="chevron-down" class="w-10 h-10"></i></button>
        
        <div class="flex-grow flex flex-col items-center justify-center">
            <div id="main-visual" class="w-full aspect-square max-w-[340px] rounded-[40px] overflow-hidden shadow-2xl relative mb-12 border border-white/10">
                <img id="main-cover" class="w-full h-full object-cover" src="">
                <iframe id="video-engine" class="absolute inset-0 w-full h-full hidden" frameborder="0"></iframe>
            </div>

            <div class="w-full text-center px-4 mb-10">
                <h2 id="main-title" class="text-3xl font-black mb-2">Titolo Brano</h2>
                <p id="main-artist" class="text-xl text-blue-400">Artista</p>
            </div>

            <div class="w-full grid grid-cols-4 gap-4 mb-10">
                <button onclick="cycleFX()" id="fx-btn" class="flex flex-col items-center gap-2 p-3 glass rounded-2xl transition">
                    <i data-lucide="zap"></i><span class="text-[9px] font-bold">FX</span>
                </button>
                <button onclick="toggleAmbient()" id="amb-btn" class="flex flex-col items-center gap-2 p-3 glass rounded-2xl transition">
                    <i data-lucide="cloud-rain"></i><span class="text-[9px] font-bold">AMB</span>
                </button>
                <button onclick="toggleGyro()" id="gyro-btn" class="flex flex-col items-center gap-2 p-3 glass rounded-2xl transition">
                    <i data-lucide="smartphone"></i><span class="text-[9px] font-bold">GYRO</span>
                </button>
                <button onclick="openCapsule()" class="flex flex-col items-center gap-2 p-3 glass rounded-2xl">
                    <i data-lucide="hourglass"></i><span class="text-[9px] font-bold">TIME</span>
                </button>
            </div>

            <div class="w-full px-2 mb-10">
                <div class="h-1.5 w-full bg-white/10 rounded-full cursor-pointer" onclick="seek(event)">
                    <div id="prog-bar" class="h-full bg-white rounded-full relative">
                        <div class="absolute right-0 top-1/2 -translate-y-1/2 w-4 h-4 bg-white rounded-full shadow-lg"></div>
                    </div>
                </div>
                <div class="flex justify-between mt-3 text-xs text-gray-500 font-mono">
                    <span id="time-cur">0:00</span>
                    <span id="time-tot">0:00</span>
                </div>
            </div>

            <div class="flex justify-around items-center w-full">
                <button onclick="skip(-1)"><i data-lucide="skip-back" class="w-10 h-10 fill-current"></i></button>
                <button onclick="togglePlay()" class="w-24 h-24 bg-white text-black rounded-full flex items-center justify-center accent-shadow">
                    <i id="main-play-icon" data-lucide="play" class="w-10 h-10 fill-current ml-1"></i>
                </button>
                <button onclick="skip(1)"><i data-lucide="skip-forward" class="w-10 h-10 fill-current"></i></button>
            </div>
        </div>

        <div class="flex justify-between mt-10">
            <button onclick="toggleLike()" id="main-like"><i data-lucide="heart"></i></button>
            <button onclick="openShare()"><i data-lucide="share-2"></i></button>
            <button onclick="toggleLoop()"><i data-lucide="repeat"></i></button>
        </div>
    </div>

    <audio id="audio" playsinline crossorigin="anonymous"></audio>
    <audio id="amb-rain" loop src="https://assets.mixkit.co/active_storage/sfx/2515/2515-preview.m4a"></audio>
    <audio id="amb-fire" loop src="https://assets.mixkit.co/active_storage/sfx/270/270-preview.m4a"></audio>

    <script>
        // --- LOGICA E FUNZIONI INTEGRATE ---
        const BASE = "https://raw.githubusercontent.com/ryzn-eu/AuraEU/main/";
        let AURA_LIST = [], LIKES = new Set(), HISTORY = [];
        let curTrack = null, fxMode = 0, ambMode = 0, gyroOn = false;

        const audio = document.getElementById('audio');

        // 1. Inizializzazione (Sorgenti Originali)
        async function init() {
            try {
                const [tr, ar] = await Promise.all([
                    fetch(BASE + "tracks.json"),
                    fetch(BASE + "artist.json")
                ]);
                const tracks = await tr.json();
                const artists = await ar.json();
                const artMap = {}; artists.forEach(a => artMap[a.id] = a.name);

                AURA_LIST = tracks.tracks.map(t => ({
                    id: t.title,
                    title: t.title,
                    artist: artMap[t.artistId] || t.artist || "Aura Choice",
                    url: BASE + "audio/" + encodeURIComponent(t.file.trim()),
                    cover: BASE + "Covers/" + (t.albumId ? encodeURIComponent(t.albumId.trim()) : t.categoryID) + ".png",
                    video: t.videoUrl,
                    category: t.categoryID,
                    vibe: Math.floor(Math.random()*100)
                }));

                renderHome();
                checkPWA();
                lucide.createIcons();
                loadStorage();
            } catch (e) { console.error("Aura Boot Error", e); }
        }

        // 2. Playback & Background (Fix Riproduzione)
        function playTrack(id) {
            const track = AURA_LIST.find(t => t.id === id);
            if (!track) return;
            curTrack = track;
            
            audio.src = track.url;
            audio.play();
            
            // Gestione MediaSession (Per background audio)
            if ('mediaSession' in navigator) {
                navigator.mediaSession.metadata = new MediaMetadata({
                    title: track.title,
                    artist: track.artist,
                    artwork: [{ src: track.cover, sizes: '512x512', type: 'image/png' }]
                });
            }

            document.getElementById('mini-player').classList.add('active');
            updateUI();
        }

        function togglePlay() {
            if (audio.paused) audio.play(); else audio.pause();
            updatePlayState();
        }

        // 3. Funzioni Avanzate Restaurate (FX, Gyro, Ambient)
        function cycleFX() {
            fxMode = (fxMode + 1) % 3;
            const btn = document.getElementById('fx-btn');
            if(fxMode === 0) { audio.playbackRate = 1.0; audio.preservesPitch = true; btn.style.color = "white"; }
            if(fxMode === 1) { audio.playbackRate = 1.25; audio.preservesPitch = false; btn.style.color = "var(--accent)"; }
            if(fxMode === 2) { audio.playbackRate = 0.85; audio.preservesPitch = true; btn.style.color = "#FFD700"; }
        }

        function toggleAmbient() {
            ambMode = (ambMode + 1) % 3;
            const r = document.getElementById('amb-rain'), f = document.getElementById('amb-fire');
            r.pause(); f.pause();
            if(ambMode === 1) { r.play(); r.volume = 0.3; }
            if(ambMode === 2) { f.play(); f.volume = 0.3; }
            document.getElementById('amb-btn').style.color = ambMode === 0 ? "white" : "var(--accent)";
        }

        function toggleGyro() {
            if(!gyroOn) {
                if(typeof DeviceOrientationEvent.requestPermission === 'function') {
                    DeviceOrientationEvent.requestPermission().then(res => { if(res==='granted') activateGyro(); });
                } else activateGyro();
            } else { gyroOn = false; window.removeEventListener('deviceorientation', handleGyro); }
        }

        function handleGyro(e) { 
            let vol = (e.gamma + 45) / 90; 
            audio.volume = Math.max(0, Math.min(1, vol)); 
        }

        function activateGyro() { 
            gyroOn = true; 
            window.addEventListener('deviceorientation', handleGyro); 
            document.getElementById('gyro-btn').style.color = "var(--accent)";
        }

        // 4. UI & Rendering
        function updateUI() {
            if(!curTrack) return;
            document.getElementById('mini-cover').src = curTrack.cover;
            document.getElementById('mini-title-wrap').innerText = curTrack.title;
            document.getElementById('main-cover').src = curTrack.cover;
            document.getElementById('main-title').innerText = curTrack.title;
            document.getElementById('main-artist').innerText = curTrack.artist;
            document.getElementById('vibe-score').innerText = `Vibe Score: ${curTrack.vibe}/100`;
            updatePlayState();
        }

        function updatePlayState() {
            const icons = [document.getElementById('mini-play-icon'), document.getElementById('main-play-icon')];
            const state = audio.paused ? 'play' : 'pause';
            icons.forEach(i => i.setAttribute('data-lucide', state));
            lucide.createIcons();
        }

        function renderHome() {
            const cont = document.getElementById('home-content');
            const cats = ['CR1', 'CR2', 'CR3', 'CR4'];
            let html = "";
            cats.forEach(c => {
                const tracks = AURA_LIST.filter(t => t.category === c);
                if(tracks.length > 0) {
                    html += `<div><h3 class="text-xl font-bold mb-4 opacity-50 px-2">${c} Choice</h3><div class="h-scroll">`;
                    tracks.forEach(t => {
                        html += `<div onclick="playTrack('${t.id}')" class="h-card">
                            <img src="${t.cover}" class="w-full aspect-square object-cover rounded-[30px] mb-3 shadow-lg">
                            <p class="text-sm font-bold truncate">${t.title}</p>
                        </div>`;
                    });
                    html += `</div></div>`;
                }
            });
            cont.innerHTML = html;
        }

        // Utility
        function showSection(id) {
            document.querySelectorAll('.section-page').forEach(s => s.classList.remove('active'));
            document.getElementById(id + '-section').classList.add('active');
        }

        function openImmersive() { document.getElementById('player-modal').style.display = 'flex'; }
        function closeImmersive() { document.getElementById('player-modal').style.display = 'none'; }
        
        function checkPWA() {
            const isPWA = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
            if(!isPWA) document.getElementById('install-blocker').classList.remove('hidden');
        }

        audio.ontimeupdate = () => {
            const p = (audio.currentTime / audio.duration) * 100;
            document.getElementById('prog-bar').style.width = p + "%";
            document.getElementById('time-cur').innerText = fmtTime(audio.currentTime);
            document.getElementById('time-tot').innerText = fmtTime(audio.duration);
        };

        function fmtTime(s) { if(isNaN(s)) return "0:00"; let m = Math.floor(s/60), sec = Math.floor(s%60); return `${m}:${sec<10?'0':''}${sec}`; }

        window.onload = init;
    </script>
</body>
</html>
