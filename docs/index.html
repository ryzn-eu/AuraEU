<!DOCTYPE html>
<html lang="en" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="google" content="notranslate">
    <title>Aura Music</title>
    
    <link rel="icon" href="https://via.placeholder.com/192x192">
    <link rel="apple-touch-icon" href="https://via.placeholder.com/192x192">
    <meta name="theme-color" content="#0a0a0c">
    <link rel="manifest" href="./manifest.json">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/color-thief/2.3.2/color-thief.umd.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <style>
        /* --- DESIGN SYSTEM --- */
        :root { 
            --primary: #8b5cf6;    
            --secondary: #06b6d4;  
            --bg-deep: #050505;    
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --glass-blur: 24px;
        }

        body { 
            background-color: var(--bg-deep); 
            color: #ffffff; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow-x: hidden; 
            -webkit-tap-highlight-color: transparent;
            padding-bottom: 120px;
        }

        /* Sfondo Gradiente Scuro */
        .fixed-background { 
            position: fixed; inset: 0; z-index: -2; 
            background: radial-gradient(circle at center, #1a1a2e 0%, #000000 100%);
            pointer-events: none; 
        }

        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(var(--glass-blur));
            -webkit-backdrop-filter: blur(var(--glass-blur));
            border: 1px solid var(--glass-border);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        /* --- GRIGLIA 3x2 (YT Style) --- */
        .yt-grid-mobile-fix {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 2rem;
        }
        @media (min-width: 600px) { .yt-grid-mobile-fix { grid-template-columns: repeat(3, 1fr); } }

        .yt-card {
            background: rgba(255,255,255,0.07);
            border-radius: 8px;
            display: flex; align-items: center;
            padding: 0; gap: 10px; height: 56px;
            transition: background 0.2s; cursor: pointer; overflow: hidden;
            border: 1px solid rgba(255,255,255,0.02);
        }
        .yt-card:active { background: rgba(255,255,255,0.15); }
        .yt-img { height: 56px; width: 56px; object-fit: cover; flex-shrink: 0; }
        .yt-info { flex: 1; overflow: hidden; padding-right: 8px; display: flex; flex-direction: column; justify-content: center; }
        .yt-title { font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .yt-artist { font-size: 11px; color: #aaa; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* --- WIDGET IOS STYLE --- */
        .ios-widget-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin: 24px 0;
        }
        .ios-card {
            background: linear-gradient(135deg, rgba(255,255,255,0.1), rgba(255,255,255,0.05));
            border-radius: 18px;
            padding: 16px;
            display: flex; flex-direction: column; justify-content: space-between;
            min-height: 120px;
            position: relative; overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .ios-content { position: relative; z-index: 10; height: 100%; display: flex; flex-direction: column; justify-content: space-between; }
        .live-dot { width: 8px; height: 8px; background: #22c55e; border-radius: 50%; box-shadow: 0 0 8px #22c55e; display: inline-block; margin-right: 6px; }

        .widget-block-title { font-size: 18px; font-weight: 800; margin-bottom: 12px; padding-left: 4px; }
        
        /* --- PLAYER IMMERSIVO (QUADRATO) --- */
        #immersive-mode { background: radial-gradient(circle at center, #1e1b4b 0%, #000000 100%); }
        .immersive-art-container {
            width: 280px; height: 280px;
            position: relative; margin: 2rem auto;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.6);
        }
        .art-square { width: 100%; height: 100%; border-radius: 24px; object-fit: cover; border: 1px solid rgba(255,255,255,0.1); }

        .controls-pill {
            background: rgba(20, 20, 20, 0.6); backdrop-filter: blur(20px);
            border-radius: 50px; padding: 12px 24px;
            display: flex; justify-content: space-between; align-items: center;
            width: 100%; max-width: 320px; margin: 0 auto;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .pill-btn { display: flex; flex-direction: column; align-items: center; font-size: 10px; color: #aaa; gap: 4px; }
        .pill-btn.active { color: var(--secondary); text-shadow: 0 0 10px var(--secondary); }

        /* --- PLAYER BAR --- */
        .player-bar-new {
            position: fixed; bottom: 20px; left: 16px; right: 16px;
            background: rgba(15, 15, 20, 0.9); backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px; height: 72px;
            z-index: 100; display: flex; align-items: center; padding: 0 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
            transform: translateY(150%); transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .player-bar-new.active { transform: translateY(0); }

        /* Utils */
        .horizontal-scroll { display: flex; overflow-x: auto; gap: 1rem; scrollbar-width: none; padding-bottom: 10px; }
        .horizontal-scroll::-webkit-scrollbar { display: none; }
        .section-page { display: none; animation: fadeIn 0.4s; }
        .section-page.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .marquee { white-space: nowrap; animation: scrolling 10s linear infinite; }
        @keyframes scrolling { 0% { transform: translateX(0); } 100% { transform: translateX(-100%); } }
        #visualizer-canvas { position: fixed; bottom: 0; left: 0; width: 100%; height: 30%; z-index: -1; pointer-events: none; opacity: 0.3; mask-image: linear-gradient(to top, black, transparent); }
    </style>
</head>
<body>

    <div class="fixed-background"></div>
    <canvas id="visualizer-canvas"></canvas>
    <div id="toast-container" class="fixed top-6 right-6 z-[200] flex flex-col gap-2"></div>

    <div id="install-blocker" class="hidden fixed inset-0 z-[9999] bg-black flex flex-col items-center justify-center p-8 text-center">
        <h2 class="text-3xl font-bold mb-4">Aura App</h2>
        <p class="text-gray-400 mb-6">Installa per l'esperienza completa.</p>
        <button onclick="forceRecheckPWA()" class="text-sm underline text-white">Ho già installato</button>
    </div>

    <div id="audio-player-container"><audio id="audioPlayer" playsinline preload="auto" crossorigin="anonymous"></audio></div>
    <audio id="ambientPlayerRain" loop hidden src="https://assets.mixkit.co/active_storage/sfx/2515/2515-preview.m4a"></audio>
    <audio id="ambientPlayerFire" loop hidden src="https://assets.mixkit.co/active_storage/sfx/270/270-preview.m4a"></audio>

    <div class="container-app max-w-4xl mx-auto px-4 pt-6">
        <header class="flex justify-between items-center mb-6">
            <div class="flex items-center gap-3 cursor-pointer" onclick="showSection('music')">
                <img src="https://raw.githubusercontent.com/ryzn-eu/AuraEU/main/Image/logo.png" class="h-8 w-auto object-contain" alt="Aura Logo">
            </div>
            <div class="flex gap-2">
                <button onclick="showSection('playlists')" class="p-2.5 glass-panel rounded-full hover:bg-white/10 transition">
                    <i data-lucide="list-music" class="w-5 h-5"></i>
                </button>
                <button onclick="openSearchModal()" class="p-2.5 glass-panel rounded-full hover:bg-white/10 transition">
                    <i data-lucide="search" class="w-5 h-5"></i>
                </button>
                <button onclick="loggedInUser ? showSection('profile') : openAuthModal('device')" class="p-2.5 glass-panel rounded-full relative hover:bg-white/10 transition">
                    <i data-lucide="user" class="w-5 h-5"></i>
                    <div id="auth-dot" class="hidden absolute top-0 right-0 w-2.5 h-2.5 bg-green-500 rounded-full border-2 border-black"></div>
                </button>
            </div>
        </header>

        <main>
            <section id="music-section" class="section-page active">
                <h2 id="home-greeting" class="text-2xl font-bold mb-4 px-1">Good Evening</h2>

                <div id="home-history-grid" class="yt-grid-mobile-fix mb-8"></div>

                <div id="home-widgets-container" class="space-y-8 pb-24"></div>
            </section>

            <section id="library-section" class="section-page">
                <h2 class="text-2xl font-bold mb-4">Brani Salvati</h2>
                <div id="liked-tracks-list" class="grid grid-cols-2 gap-3"></div>
            </section>

            <section id="playlists-section" class="section-page">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-2xl font-bold">Sessioni</h2>
                    <button onclick="openCreatePlaylistModal()" class="p-2 bg-white/10 rounded-full"><i data-lucide="plus" class="w-5 h-5"></i></button>
                </div>
                <div id="playlists-list" class="grid grid-cols-2 gap-3 pb-24"></div>
            </section>

            <section id="profile-section" class="section-page">
                <div class="glass-panel p-6 rounded-3xl mb-6 text-center relative overflow-hidden">
                    <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-violet-500 to-cyan-500"></div>
                    <h3 id="profile-info" class="text-xl font-bold mt-2">Ospite</h3>
                    <p id="vibe-score-display" class="text-sm text-cyan-400 font-bold mb-4">Vibe Score: 0</p>
                    <div class="flex justify-center gap-3">
                        <select id="language-selector" onchange="changeLanguage(this.value)" class="bg-black/30 text-xs p-2 rounded-lg border border-white/10 text-white">
                            <option value="en">English</option> <option value="it">Italiano</option>
                        </select>
                        <button onclick="handleLogout()" class="text-xs bg-red-500/10 text-red-400 px-4 py-2 rounded-lg font-bold border border-red-500/20">Logout</button>
                    </div>
                </div>
                <h3 class="font-bold mb-3 px-2">Cronologia</h3>
                <div id="history-list" class="space-y-2 pb-24"></div>
            </section>
        </main>
    </div>

    <div id="immersive-mode" class="fixed inset-0 z-[150] hidden flex flex-col justify-between p-6 pb-10 overflow-y-auto">
        <div class="flex justify-between items-center mt-2">
            <button onclick="exitImmersiveMode()" class="p-3 bg-white/5 rounded-full backdrop-blur-md"><i data-lucide="chevron-down" class="w-6 h-6"></i></button>
            <span class="text-[10px] font-bold tracking-widest uppercase opacity-50">Now Playing</span>
            <button onclick="openShareModal()" class="p-3 bg-white/5 rounded-full backdrop-blur-md"><i data-lucide="share-2" class="w-6 h-6"></i></button>
        </div>

        <div class="flex-1 flex flex-col items-center justify-center w-full">
            <div class="immersive-art-container">
                <img id="immersive-cover" src="" class="art-square" crossorigin="anonymous">
                <iframe id="immersive-video-player" class="art-square bg-black hidden" frameborder="0" allowfullscreen></iframe>
                <button id="switch-to-video-btn" onclick="toggleImmersiveVisuals()" class="hidden absolute bottom-2 right-2 bg-black/80 p-2 rounded-full border border-white/20 z-10"><i data-lucide="video" class="w-4 h-4"></i></button>
            </div>

            <div class="text-center w-full px-4 mb-6">
                <div id="immersive-title-wrapper" class="w-full overflow-hidden h-10">
                    <h2 id="immersive-title" class="text-2xl font-bold marquee">Scegli un brano</h2>
                </div>
                <p id="immersive-artist" class="text-lg text-gray-400 font-medium mt-1">Artista</p>
            </div>

            <div class="w-full max-w-sm px-2 mb-8 group" id="progress-bar-immersive-container">
                <div class="w-full h-1.5 bg-white/10 rounded-full overflow-hidden relative cursor-pointer">
                    <div id="progress-bar-immersive" class="h-full bg-gradient-to-r from-violet-500 to-cyan-400 w-0 relative">
                        <div class="absolute right-0 top-1/2 -translate-y-1/2 w-3 h-3 bg-white rounded-full shadow-[0_0_10px_white] scale-0 group-hover:scale-100 transition-transform"></div>
                    </div>
                </div>
            </div>

            <div class="flex items-center justify-between w-full max-w-[280px] mb-8">
                <button onclick="toggleLoop()" class="opacity-50 hover:opacity-100"><i data-lucide="repeat" class="w-5 h-5"></i></button>
                <button onclick="skipBackward()"><i data-lucide="skip-back" class="w-8 h-8 fill-current"></i></button>
                <button onclick="togglePlayPause()" class="w-16 h-16 bg-white text-black rounded-full flex items-center justify-center shadow-[0_0_25px_rgba(255,255,255,0.3)] hover:scale-105 transition">
                    <i id="immersive-play-icon" data-lucide="play" class="w-7 h-7 fill-current ml-1"></i>
                </button>
                <button onclick="skipForward()"><i data-lucide="skip-forward" class="w-8 h-8 fill-current"></i></button>
                <div class="flex flex-col gap-1 items-center">
                    <button onclick="toggleLike()" id="like-button-immersive" class="opacity-50 hover:text-red-500"><i data-lucide="heart" class="w-5 h-5"></i></button>
                    <button onclick="openAddToPlaylistModal()" class="opacity-50 hover:text-white"><i data-lucide="list-plus" class="w-5 h-5"></i></button>
                </div>
            </div>

            <div class="controls-pill">
                <button onclick="toggleAmbientMenu()" id="btn-ambient" class="pill-btn"><i data-lucide="cloud-rain" class="w-5 h-5"></i><span>Focus</span></button>
                <button onclick="cycleAudioFX()" id="btn-fx" class="pill-btn relative"><i data-lucide="wand-2" class="w-5 h-5"></i><span>FX</span><span id="fx-badge" class="absolute top-0 right-0 w-2 h-2 bg-cyan-400 rounded-full hidden"></span></button>
                <button onclick="toggleGyro()" id="btn-gyro" class="pill-btn"><i data-lucide="smartphone" class="w-5 h-5"></i><span>Gyro</span></button>
                <button onclick="openCapsuleModal()" class="pill-btn"><i data-lucide="hourglass" class="w-5 h-5"></i><span>Capsule</span></button>
            </div>
        </div>
    </div>

    <div onclick="enterImmersiveMode()" class="player-bar-new cursor-pointer">
        <div class="flex items-center gap-3 flex-1 overflow-hidden">
            <img id="player-cover" src="https://via.placeholder.com/64" class="w-10 h-10 rounded-lg object-cover bg-white/10" crossorigin="anonymous">
            <div class="flex flex-col overflow-hidden">
                <div id="player-title-wrapper" class="w-32 overflow-hidden h-5"><p id="player-title" class="text-sm font-bold truncate marquee">Not Playing</p></div>
                <p id="player-artist" class="text-xs text-gray-400 truncate">Tap to play</p>
            </div>
        </div>
        <div class="flex items-center gap-4">
             <button onclick="event.stopPropagation(); togglePlayPause()" class="w-10 h-10 rounded-full bg-white text-black flex items-center justify-center">
                <i id="play-icon" data-lucide="play" class="w-4 h-4 fill-current ml-0.5"></i>
             </button>
        </div>
        <div class="absolute bottom-0 left-4 right-4 h-[2px] bg-white/10 rounded-full overflow-hidden">
            <div id="progress-bar" class="h-full bg-cyan-400 w-0"></div>
        </div>
    </div>

    <div id="auth-modal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-[200] hidden flex items-center justify-center p-6"><div class="glass-panel p-8 rounded-3xl w-full max-w-sm text-center"><h2 class="text-2xl font-bold mb-2">Benvenuto</h2><button onclick="handleAuthAction('device')" class="w-full py-3 bg-white text-black rounded-xl font-bold mt-4">Login Ospite</button><button onclick="closeAuthModal()" class="mt-4 text-xs opacity-50">Chiudi</button></div></div>
    <div id="capsule-modal" class="fixed inset-0 bg-black/80 z-[200] hidden flex items-center justify-center p-6"><div class="glass-panel p-8 rounded-3xl w-full max-w-sm border border-amber-500/30 text-center"><i data-lucide="hourglass" class="w-8 h-8 text-amber-500 mx-auto mb-2"></i><h3 class="text-xl font-bold">Time Capsule</h3><p class="text-xs text-gray-400 mb-4">Sigilla questo brano</p><input type="date" id="capsule-date" class="w-full bg-white/10 p-3 rounded-lg text-white mb-4"><button onclick="confirmTimeCapsule()" class="w-full py-3 bg-amber-600 rounded-lg font-bold">Sigilla</button><button onclick="closeCapsuleModal()" class="mt-3 text-xs opacity-50">Annulla</button></div></div>
    <div id="share-modal" class="fixed inset-0 bg-black/90 z-[210] hidden flex flex-col items-center justify-center p-6"><div id="share-card-content" class="w-64 aspect-[4/5] bg-gradient-to-br from-violet-900 to-black rounded-2xl p-4 flex flex-col items-center justify-center shadow-2xl relative border border-white/10"><img id="share-card-cover" src="" class="w-32 h-32 rounded-full shadow-lg mb-4" crossorigin="anonymous"><h2 id="share-card-title" class="font-bold text-center text-sm"></h2><p id="share-card-artist" class="text-xs opacity-50"></p><div id="share-qr-container" class="mt-4 bg-white p-1 rounded"></div></div><div class="flex gap-4 mt-6"><button onclick="downloadShareImage()" class="p-3 bg-white/10 rounded-full"><i data-lucide="download"></i></button><button onclick="shareCanvasNative()" class="p-3 bg-cyan-600 rounded-full"><i data-lucide="share-2"></i></button></div><button onclick="closeShareModal()" class="mt-6 text-sm opacity-50">Chiudi</button></div>
    <div id="search-modal" class="fixed inset-0 bg-black/90 z-[200] hidden flex flex-col p-4"><div class="flex gap-2 mb-4"><input type="text" id="search-input" oninput="performSearch()" placeholder="Cerca..." class="flex-1 bg-white/10 p-3 rounded-xl text-white outline-none"><button onclick="closeSearchModal()" class="p-3">X</button></div><div id="search-results" class="flex-1 overflow-y-auto space-y-2"></div></div>
    
    <div id="create-playlist-modal" class="fixed inset-0 bg-black/80 z-[200] hidden flex items-center justify-center p-6"><div class="glass-panel p-6 rounded-2xl w-full max-w-sm"><h3 class="font-bold mb-4">Nuova Sessione</h3><input type="text" id="playlist-name-input" placeholder="Nome" class="w-full p-3 rounded-xl bg-white/10 text-white mb-4"><div class="flex justify-end gap-2"><button onclick="closeCreatePlaylistModal()" class="text-xs">Annulla</button><button onclick="createPlaylist()" class="bg-white text-black px-4 py-2 rounded-lg font-bold text-sm">Crea</button></div></div></div>
    <div id="add-to-playlist-modal" class="fixed inset-0 bg-black/80 z-[200] hidden flex items-center justify-center p-6"><div class="glass-panel p-6 rounded-2xl w-full max-w-sm"><h3 class="font-bold mb-4">Aggiungi a...</h3><div id="playlist-selection-list" class="max-h-60 overflow-y-auto space-y-2"></div><button onclick="closeAddToPlaylistModal()" class="mt-4 w-full text-xs">Chiudi</button></div></div>

    <script>
        const GITHUB_RAW_BASE = "https://raw.githubusercontent.com/ryzn-eu/AuraEU/main/";
        const API = { tracks: GITHUB_RAW_BASE + "tracks.json", artists: GITHUB_RAW_BASE + "artist.json" };
        
        let AURA_MAP = [], ARTISTS_DATA = []; 
        let currentTrackData = null, audioPlayer = null, immersiveVideoPlayer = null; 
        let likedTracks = new Set(), userPlaylists = [], isLooping = false, loggedInUser = null, listeningHistory = []; 
        let currentLang = 'en', fxMode = 0, currentAmbientMode = null, gyroEnabled = false;

        document.addEventListener('DOMContentLoaded', async () => {
            getDOMElements();
            loadLocalData();
            await fetchTracks();
            checkPWAStatus();
            initVisualizer();
            lucide.createIcons();
            showSection('music');
        });

        function getDOMElements() {
            audioPlayer = document.getElementById('audioPlayer');
            immersiveVideoPlayer = document.getElementById('immersive-video-player');
            audioPlayer.addEventListener('timeupdate', updateProgress);
            audioPlayer.addEventListener('ended', () => { if(!isLooping) skipForward(); else { audioPlayer.currentTime=0; audioPlayer.play(); } });
            audioPlayer.addEventListener('play', () => { document.querySelector('.player-bar-new').classList.add('active'); togglePlayIcon(false); });
            audioPlayer.addEventListener('pause', () => togglePlayIcon(true));
        }

        async function fetchTracks() {
            try {
                const [tr, ar] = await Promise.all([fetch(API.tracks), fetch(API.artists)]);
                const tJson = await tr.json(); const aJson = await ar.json();
                const artistMap = {}; aJson.forEach(a => artistMap[a.id] = a.name);
                
                AURA_MAP = (tJson.tracks || []).map(t => {
                    let coverUrl = "https://via.placeholder.com/300";
                    if(t.albumId) coverUrl = GITHUB_RAW_BASE + "Covers/" + encodeURIComponent(t.albumId.trim()) + ".png";
                    else if (t.categoryID) coverUrl = GITHUB_RAW_BASE + "Covers/" + t.categoryID + ".png";

                    return {
                        id: t.title.trim(),
                        title: t.title.trim(),
                        artist: artistMap[t.artistId] || t.artist || "Artista Sconosciuto",
                        audioUrl: GITHUB_RAW_BASE + "audio/" + encodeURIComponent(t.file.replace(/\s(\.[a-z0-9]+)$/i, '$1')),
                        cover: coverUrl,
                        categoryID: t.categoryID,
                        videoUrl: t.videoUrl
                    };
                });
                
                renderHomePageWidgets();
                renderHistoryGrid(); 
            } catch(e) { console.error("Errore Fetch", e); }
        }

        window.playTrack = function(id) {
            const t = AURA_MAP.find(x => x.id === id);
            if(!t) return;
            currentTrackData = t;
            audioPlayer.src = t.audioUrl;
            audioPlayer.playbackRate = 1.0; fxMode = 0; updateFXBadge();
            audioPlayer.play().catch(e=>console.log(e));
            updateUI(t);
            setImmersiveVisual('cover');
            listeningHistory = [id, ...listeningHistory.filter(x => x !== id)].slice(0, 20);
            saveLocalData();
            renderHistoryGrid(); 
        };

        function updateUI(t) {
            document.querySelectorAll('#player-title, #immersive-title, #share-card-title').forEach(e => e.innerText = t.title);
            document.querySelectorAll('#player-artist, #immersive-artist, #share-card-artist').forEach(e => e.innerText = t.artist);
            document.querySelectorAll('#player-cover, #immersive-cover, #share-card-cover').forEach(e => e.src = t.cover);
            
            const img = new Image(); img.crossOrigin = "anonymous"; img.src = t.cover;
            img.onload = () => {
                try {
                    const c = new ColorThief().getColor(img);
                    document.documentElement.style.setProperty('--primary', `rgb(${c[0]},${c[1]},${c[2]})`);
                } catch(e){}
            };
            lucide.createIcons();
        }

        function renderHistoryGrid() {
            const grid = document.getElementById('home-history-grid');
            if(!grid) return;
            const recent = listeningHistory.slice(0, 6).map(id => AURA_MAP.find(t => t.id === id)).filter(Boolean);
            if(recent.length === 0) {
                 const fallback = AURA_MAP.filter(t=>t.categoryID==='CR1').slice(0,6);
                 grid.innerHTML = fallback.map(t => createYtCard(t)).join('');
            } else {
                grid.innerHTML = recent.map(t => createYtCard(t)).join('');
            }
        }
        
        function createYtCard(t) {
            return `<div onclick="playTrack('${t.id}')" class="yt-card"><img src="${t.cover}" class="yt-img"><div class="yt-info"><div class="yt-title">${t.title}</div><div class="yt-artist">${t.artist}</div></div></div>`;
        }

        function renderHomePageWidgets() {
            const container = document.getElementById('home-widgets-container');
            let html = "";
            
            let recommended = [];
            if(listeningHistory.length > 0) {
                 const last = AURA_MAP.find(t=>t.id === listeningHistory[0]);
                 if(last) recommended = AURA_MAP.filter(t => t.categoryID === last.categoryID && t.id !== last.id).slice(0, 8);
            }
            if(recommended.length === 0) recommended = AURA_MAP.slice(0, 8);
            html += createWidgetBlock("Recommended for You", recommended);

            const cr1 = AURA_MAP.filter(t => t.categoryID === 'CR1').slice(0, 8);
            if(cr1.length) html += createWidgetBlock("Trending Now", cr1);
            
            const visitors = Math.floor(Math.random() * 500) + 120;
            html += `
            <div class="ios-widget-row">
                <div class="ios-card">
                     <div class="ios-content">
                         <div class="p-2 bg-white/10 rounded-full w-max"><i data-lucide="globe" class="w-4 h-4 text-green-400"></i></div>
                         <div>
                             <p class="text-2xl font-bold">${visitors}</p>
                             <p class="text-[10px] text-gray-400"><span class="live-dot"></span>Online Now</p>
                         </div>
                     </div>
                </div>
                <div class="ios-card cursor-pointer" onclick="showSection('library')">
                     <div class="ios-content">
                         <div class="p-2 bg-white/10 rounded-full w-max"><i data-lucide="heart" class="w-4 h-4 text-red-400"></i></div>
                         <div>
                             <p class="text-2xl font-bold">${likedTracks.size}</p>
                             <p class="text-[10px] text-gray-400">Liked Tracks</p>
                         </div>
                     </div>
                </div>
            </div>`;

            const cr2 = AURA_MAP.filter(t => t.categoryID === 'CR2').slice(0, 8);
            if(cr2.length) html += createWidgetBlock("Relax & Chill", cr2);

            const cr3 = AURA_MAP.filter(t => t.categoryID === 'CR3').slice(0, 8);
            if(cr3.length) html += createWidgetBlock("Classics", cr3);

            container.innerHTML = html;
        }

        function createWidgetBlock(title, tracks) {
            if(!tracks.length) return '';
            return `<div><h3 class="widget-block-title">${title}</h3><div class="horizontal-scroll">${tracks.map(t => `
                <div onclick="playTrack('${t.id}')" class="flex-none w-36 cursor-pointer group">
                    <div class="relative"><img src="${t.cover}" class="w-36 h-36 rounded-xl object-cover mb-2 shadow-lg group-active:scale-95 transition"><div class="absolute inset-0 bg-black/20 hidden group-hover:flex items-center justify-center rounded-xl"><i data-lucide="play" class="fill-white text-white"></i></div></div>
                    <p class="text-xs font-bold truncate">${t.title}</p><p class="text-[10px] text-gray-400 truncate">${t.artist}</p>
                </div>`).join('')}</div></div>`;
        }

        // --- FEATURES ---
        window.cycleAudioFX = function() { fxMode=(fxMode+1)%3; audioPlayer.playbackRate=fxMode===1?1.25:(fxMode===2?0.85:1.0); audioPlayer.preservesPitch=(fxMode!==1); updateFXBadge(); };
        function updateFXBadge() { document.getElementById('fx-badge').classList.toggle('hidden', fxMode===0); }
        window.toggleAmbientMenu = function() { const r=document.getElementById('ambientPlayerRain'); if(currentAmbientMode){r.pause();currentAmbientMode=null;}else{r.volume=0.3;r.play();currentAmbientMode='rain';} document.getElementById('btn-ambient').classList.toggle('active',currentAmbientMode); };
        window.toggleGyro = function() { if(!gyroEnabled){window.addEventListener('deviceorientation',handleGyro);gyroEnabled=true;}else{window.removeEventListener('deviceorientation',handleGyro);gyroEnabled=false;} document.getElementById('btn-gyro').classList.toggle('active',gyroEnabled); };
        function handleGyro(e) { if(gyroEnabled) audioPlayer.volume=Math.max(0,Math.min(1,(e.gamma+45)/90)); }
        window.openCapsuleModal=()=>document.getElementById('capsule-modal').classList.remove('hidden');
        window.closeCapsuleModal=()=>document.getElementById('capsule-modal').classList.add('hidden');
        window.confirmTimeCapsule=()=>{showToast("Sigillato");closeCapsuleModal();};
        window.openShareModal=()=>{if(!currentTrackData)return;document.getElementById('share-modal').classList.remove('hidden');new QRCode(document.getElementById('share-qr-container'),{text:"aura.app/"+currentTrackData.id,width:64,height:64});};
        window.closeShareModal=()=>document.getElementById('share-modal').classList.add('hidden');
        window.openSearchModal=()=>document.getElementById('search-modal').classList.remove('hidden');
        window.closeSearchModal=()=>document.getElementById('search-modal').classList.add('hidden');
        window.performSearch=()=>{ const q=document.getElementById('search-input').value.toLowerCase(); document.getElementById('search-results').innerHTML=AURA_MAP.filter(t=>t.title.toLowerCase().includes(q)).map(t=>`<div onclick="playTrack('${t.id}');closeSearchModal()" class="flex items-center gap-3 p-2 border-b border-white/10 cursor-pointer"><img src="${t.cover}" class="w-8 h-8 rounded"><p class="text-sm">${t.title}</p></div>`).join(''); };
        window.showSection=(id)=>{ document.querySelectorAll('.section-page').forEach(e=>e.classList.remove('active')); document.getElementById(id+'-section').classList.add('active'); if(id==='music')renderHistoryGrid(); if(id==='profile')renderFullHistory(); if(id==='playlists')renderPlaylists(); };
        function renderFullHistory() { document.getElementById('history-list').innerHTML=listeningHistory.map(id=>{const t=AURA_MAP.find(x=>x.id===id);return t?`<div onclick="playTrack('${t.id}')" class="flex items-center gap-3 p-2 bg-white/5 rounded-lg"><img src="${t.cover}" class="w-10 h-10 rounded"><div><p class="font-bold text-xs">${t.title}</p></div></div>`:'';}).join(''); }
        function initVisualizer() { const cvs=document.getElementById('visualizer-canvas');const ctx=cvs.getContext('2d');let w,h;const resize=()=>{w=cvs.width=window.innerWidth;h=cvs.height=window.innerHeight;};window.addEventListener('resize',resize);resize();function loop(){ctx.clearRect(0,0,w,h);requestAnimationFrame(loop);}loop(); }
        
        // --- DATA PERSISTENCE (Updated for Playlists) ---
        function saveLocalData(){
            localStorage.setItem('aura_hist',JSON.stringify(listeningHistory));
            localStorage.setItem('aura_playlists',JSON.stringify(userPlaylists));
        }
        function loadLocalData(){
            listeningHistory=JSON.parse(localStorage.getItem('aura_hist')||'[]');
            userPlaylists=JSON.parse(localStorage.getItem('aura_playlists')||'[]');
        }

        function showToast(m){const t=document.createElement('div');t.className="bg-white/10 backdrop-blur-md px-4 py-2 rounded-xl text-xs font-bold border border-white/20";t.innerText=m;document.getElementById('toast-container').appendChild(t);setTimeout(()=>t.remove(),2000);}
        function updateProgress(){const p=(audioPlayer.currentTime/audioPlayer.duration)*100||0;document.querySelectorAll('#progress-bar, #progress-bar-immersive').forEach(e=>e.style.width=p+"%");}
        function togglePlayIcon(isPaused){document.querySelectorAll('#play-icon, #immersive-play-icon').forEach(i=>i.setAttribute('data-lucide',isPaused?'play':'pause'));lucide.createIcons();}
        window.togglePlayPause=()=>audioPlayer.paused?audioPlayer.play():audioPlayer.pause();
        window.skipForward=()=>{if(currentTrackData){const i=AURA_MAP.findIndex(x=>x.id===currentTrackData.id);playTrack(AURA_MAP[(i+1)%AURA_MAP.length].id);}};
        window.skipBackward=()=>{if(currentTrackData){const i=AURA_MAP.findIndex(x=>x.id===currentTrackData.id);playTrack(AURA_MAP[(i-1+AURA_MAP.length)%AURA_MAP.length].id);}};
        window.enterImmersiveMode=()=>document.getElementById('immersive-mode').classList.remove('hidden');
        window.exitImmersiveMode=()=>document.getElementById('immersive-mode').classList.add('hidden');
        window.checkPWAStatus=()=>{};window.forceRecheckPWA=()=>window.location.reload();window.handleLogout=()=>window.location.reload();
        window.openAuthModal=()=>document.getElementById('auth-modal').classList.remove('hidden');
        window.closeAuthModal=()=>document.getElementById('auth-modal').classList.add('hidden');
        window.handleAuthAction=()=>{loggedInUser=true;document.getElementById('auth-dot').classList.remove('hidden');closeAuthModal();showSection('profile');};
        window.toggleImmersiveVisuals=()=>{const v=document.getElementById('immersive-video-player');const c=document.getElementById('immersive-cover');if(v.classList.contains('hidden')){v.src=currentTrackData.videoUrl;v.classList.remove('hidden');c.classList.add('hidden');}else{v.classList.add('hidden');c.classList.remove('hidden');}};
        window.setImmersiveVisual=(m)=>{document.getElementById('immersive-cover').classList.remove('hidden');document.getElementById('immersive-video-player').classList.add('hidden');document.getElementById('switch-to-video-btn').classList.toggle('hidden',!currentTrackData.videoUrl);};
        window.toggleLoop=()=>{isLooping=!isLooping;showToast(isLooping?"Loop On":"Loop Off");};
        window.toggleLike=()=>{if(likedTracks.has(currentTrackData.id))likedTracks.delete(currentTrackData.id);else likedTracks.add(currentTrackData.id);showToast(likedTracks.has(currentTrackData.id)?"Salvato":"Rimosso");renderLikedTracks();};
        function renderLikedTracks(){document.getElementById('liked-tracks-list').innerHTML=Array.from(likedTracks).map(id=>{const t=AURA_MAP.find(x=>x.id===id);return createYtCard(t);}).join('');}
        
        // --- PLAYLIST LOGIC (NEW FIXED) ---
        window.openCreatePlaylistModal=()=>document.getElementById('create-playlist-modal').classList.remove('hidden');
        window.closeCreatePlaylistModal=()=>document.getElementById('create-playlist-modal').classList.add('hidden');
        
        window.createPlaylist = () => {
            const el = document.getElementById('playlist-name-input');
            const name = el.value.trim();
            if(!name) return showToast("Inserisci un nome");
            userPlaylists.push({ id: Date.now(), name: name, tracks: [] });
            saveLocalData();
            closeCreatePlaylistModal();
            renderPlaylists();
            el.value = ''; 
            showToast("Sessione creata");
        };

        window.renderPlaylists = () => {
            const container = document.getElementById('playlists-list');
            if(!container) return;
            if(userPlaylists.length === 0) {
                container.innerHTML = '<p class="text-xs text-gray-500 col-span-2 text-center mt-4">Nessuna sessione.</p>';
                return;
            }
            container.innerHTML = userPlaylists.map(pl => `
                <div onclick="playPlaylist(${pl.id})" class="p-4 glass-panel rounded-xl cursor-pointer relative group">
                    <h3 class="font-bold">${pl.name}</h3>
                    <p class="text-xs text-gray-400">${pl.tracks.length} brani</p>
                    <button onclick="event.stopPropagation(); deletePlaylist(${pl.id})" class="absolute top-2 right-2 p-1 opacity-60 hover:opacity-100 hover:text-red-500"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                </div>
            `).join('');
            lucide.createIcons();
        };

        window.openAddToPlaylistModal = () => {
            if(!currentTrackData) return showToast("Nessun brano in play");
            const list = document.getElementById('playlist-selection-list');
            if(userPlaylists.length === 0) {
                 list.innerHTML = '<p class="text-xs text-center text-gray-500">Crea prima una sessione.</p>';
            } else {
                list.innerHTML = userPlaylists.map(pl => {
                    const hasTrack = pl.tracks.includes(currentTrackData.id);
                    return `<div onclick="toggleTrackInPlaylist(${pl.id})" class="p-3 mb-2 rounded-lg cursor-pointer flex justify-between items-center ${hasTrack ? 'bg-green-500/20 border border-green-500/50' : 'bg-white/5'}">
                        <span class="text-sm">${pl.name}</span>
                        ${hasTrack ? '<i data-lucide="check" class="w-4 h-4 text-green-500"></i>' : '<i data-lucide="plus" class="w-4 h-4 opacity-50"></i>'}
                    </div>`;
                }).join('');
            }
            document.getElementById('add-to-playlist-modal').classList.remove('hidden');
            lucide.createIcons();
        };

        window.closeAddToPlaylistModal = () => document.getElementById('add-to-playlist-modal').classList.add('hidden');

        window.toggleTrackInPlaylist = (plId) => {
            const pl = userPlaylists.find(p => p.id == plId);
            if(pl) {
                const idx = pl.tracks.indexOf(currentTrackData.id);
                if(idx > -1) { pl.tracks.splice(idx, 1); showToast("Rimosso da " + pl.name); }
                else { pl.tracks.push(currentTrackData.id); showToast("Aggiunto a " + pl.name); }
                saveLocalData();
                openAddToPlaylistModal(); 
                renderPlaylists(); 
            }
        };

        window.playPlaylist = (plId) => {
            const pl = userPlaylists.find(p => p.id == plId);
            if(pl && pl.tracks.length > 0) {
                playTrack(pl.tracks[0]);
                showToast(`Sessione: ${pl.name}`);
            } else {
                showToast("Sessione vuota");
            }
        };
        
        window.deletePlaylist = (id) => {
             if(confirm("Eliminare sessione?")) {
                 userPlaylists = userPlaylists.filter(p => p.id != id);
                 saveLocalData();
                 renderPlaylists();
             }
        };
    </script>
</body>
</html>
